example":"Each individual received instructions before the experiment.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"legal","zh":"法律上的；合法的","example":"The company sought legal advice before signing the agreement.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"major","zh":"主要的；主修","example":"A major concern was the lack of reliable evidence.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"method","zh":"方法","example":"The team tested a new method of reducing plastic waste.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"occur","zh":"發生","example":"Unexpected delays may occur during construction.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4,"chunk":"occur to someone; occur frequently","chunkZh":"突然想到；經常發生"},{"word":"percent","zh":"百分之…","example":"Nearly 60 percent of respondents supported the proposal.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"period","zh":"時期；一段時間","example":"The museum will remain closed for a short period.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"policy","zh":"政策","example":"The school introduced a policy to reduce food waste.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"principle","zh":"原則","example":"The plan is based on the principle of equal access.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"proceed","zh":"繼續進行","example":"The team decided to proceed despite the initial difficulties.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"research","zh":"研究","example":"Recent research suggests that sleep affects memory.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4,"chunk":"carry out research; research findings","chunkZh":"進行研究；研究發現"},{"word":"role","zh":"角色","example":"Public libraries play an important role in communities.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"section","zh":"地域","example":"The final section discusses possible solutions.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"source","zh":"來源","example":"The journalist checked the original source before publishing.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4,"chunk":"a source of; reliable sources","chunkZh":"來源；可靠來源"},{"word":"structure","zh":"結構","example":"The earthquake damaged the structure of several historic buildings.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"theory","zh":"理論","example":"The experiment was designed to test the theory.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"vary","zh":"變化","example":"Prices vary according to location and demand.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4,"chunk":"vary from ... to ...; vary according to","chunkZh":"從……到……不等；依……而不同"},{"word":"affect","zh":"影響；使感動","example":"Poor air quality can affect children's concentration.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4,"chunk":"be affected by; affect the outcome","chunkZh":"受到影響；影響結果"},{"word":"aspect","zh":"方面；觀點","example":"The report examines the economic aspect of the issue.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"assist","zh":"協助","example":"Volunteers will assist visitors who need directions.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"chapter","zh":"章，回","example":"The final chapter examines the long-term consequences.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"commission","zh":"佣金；委託","example":"The city appointed a commission to review the policy.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"compute","zh":"估算；推算","example":"The software can compute the total cost automatically.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"conclude","zh":"結束；斷定","example":"The investigators could not conclude that the product was safe.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"consequent","zh":"因…的結果而起的","example":"The consequent increase in costs forced changes to the plan.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"construct","zh":"建造","example":"Engineers plan to construct a bridge across the river.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"credit","zh":"信用；賒帳","example":"The store offered customers credit for returned items.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"design","zh":"設計","example":"The design of the building allows natural light to enter.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"distinct","zh":"有區別的","example":"The two studies reached distinct conclusions.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"element","zh":"元素","example":"Trust is an essential element of effective teamwork.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"final","zh":"最後的","example":"The final report will be published next month.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"injure","zh":"傷害","example":"The falling branches could injure people walking nearby.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"item","zh":"項目","example":"Each item must be checked before departure.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"journal","zh":"雜誌；期刊","example":"The findings appeared in an international scientific journal.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"normal","zh":"正常的","example":"It may take weeks for services to return to normal.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"previous","zh":"以前的","example":"The previous study used a much smaller sample.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"primary","zh":"主要的","example":"The primary purpose was to identify unmet needs.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"purchase","zh":"購買","example":"Customers can purchase tickets online.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"range","zh":"區域","example":"The program offers a wide range of activities.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"region","zh":"地區","example":"The region experienced unusually heavy rainfall.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"regulate","zh":"限制；控管","example":"New laws aim to regulate the use of personal data.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"reside","zh":"居住","example":"Many students reside outside the city.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"restrict","zh":"限制","example":"The rules restrict access to sensitive information.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"secure","zh":"安全的","example":"The system provides a secure way to store records.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"select","zh":"挑選","example":"The judges will select the winner based on originality.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"site","zh":"場所","example":"The team visited the site before construction began.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"survey","zh":"調查；審視","example":"The school conducted a survey of students' reading habits.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"text","zh":"本文","example":"Consider the entire text before drawing conclusions.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"tradition","zh":"傳統","example":"The festival celebrates a local tradition.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"comment","zh":"評論","example":"The researcher declined to comment on the findings.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"component","zh":"零件；成分","example":"Regular feedback is an important component of the course.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"consent","zh":"同意","example":"Participants gave written consent before joining the study.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"constant","zh":"固定的","example":"Constant interruptions can reduce productivity.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":4},{"word":"convene","zh":"召集","example":"The committee will convene next week.","source":"學術高頻字詞 AWL 對照整理（教 ude from the passage.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"insert","zh":"插入","example":"Please insert the card into the reader.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"isolate","zh":"使孤立","example":"The researchers tried to isolate the cause of the problem.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"media","zh":"媒體","example":"Social media can spread information rapidly.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"phenomenon","zh":"現象","example":"Scientists are studying the unusual natural phenomenon.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"publication","zh":"公布","example":"The report is being prepared for publication.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"quote","zh":"引用","example":"The journalist decided to quote the original interview.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"release","zh":"解放","example":"The agency will release its findings next week.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"reverse","zh":"相反的；反轉","example":"The policy aims to reverse the decline in recycling rates.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"sole","zh":"腳底(板)；鞋底","example":"The organization was the sole provider of the service.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"somewhat","zh":"有點","example":"The revised plan was somewhat more practical.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"submit","zh":"提交","example":"All applicants must submit their forms online.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"thesis","zh":"論文","example":"The student defended her thesis before the committee.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"topic","zh":"題目","example":"The class selected climate change as its discussion topic.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"transmit","zh":"傳播","example":"The device can transmit data over long distances.","so "學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"guideline","zh":"指導方針","example":"The organization published a guideline for safe travel.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"implicit","zh":"暗示的","example":"The agreement contained an implicit promise of cooperation.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"inspect","zh":"檢查","example":"Engineers will inspect the bridge before reopening it.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"intense","zh":"強烈的","example":"The region experienced intense rainfall.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"manipulate","zh":"操縱","example":"The software allows users to manipulate digital images.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"nuclear","zh":"核子的","example":"The government announced a review of nuclear energy policy.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"paragraph","zh":"段落","example":"Each paragraph should focus on a single main idea.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"practitioner","zh":"開業者","example":"An experienced practitioner explained the treatment options.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"prospect","zh":"期望","example":"The company faces the prospect of higher operating costs.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"restore","zh":"歸還","example":"Volunteers helped restore the damaged historic building.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"revise","zh":"校正","example":"Students should revise their essays after receiving feedback.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"schedule","zh":"時間表","example":"The conference schedule was updated yesterday.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"tense","zh":"緊張的","example":"The atmosphere grew tense during the negotiations.","source":"學術高頻字詞 AWL 對照整理（教學分級；暫無例句）","level":5},{"word":"terminate","zh":"(使)終止","example":"The company may terminat red","discovering","having discovered"],"ans":1,"explain":"believed to have + p.p. 表示據信過去已完成的動作。","level":6},{"id":"adv-026","num":26,"type":"grammar","q":"By the time the train arrived, the passengers ____ for nearly an hour.","opts":["had been waiting","have waited","will be waiting","are waiting"],"ans":0,"explain":"過去完成進行式描述過去某時間前持續的動作。","level":6},{"id":"adv-027","num":27,"type":"grammar","q":"No sooner had the meeting begun ____ the fire alarm went off.","opts":["when","than","until","while"],"ans":1,"explain":"No sooner ... than ... 固定搭配。","level":6},{"id":"adv-028","num":28,"type":"grammar","q":"It was the lack of clear instructions ____ caused the confusion.","opts":["who","where","that","what"],"ans":2,"explain":"強調句 It was ... that ...。","level":6},{"id":"adv-c1-1","num":1,"type":"cloze","q":"Which best fits blank (1)?","opts":["reduces","predicts","ignores","measures"],"ans":0,"explain":"reduce waste 減少廢棄物。","passage":"An increasing number of cities are encouraging residents to repair household items instead of discarding them. A repair café, for instance, provides tools and volunteers who help visitors fix broken objects. This approach not only (1) ____ the amount of waste but also creates opportunities for neighbors to share practical skills. Nevertheless, such programs cannot succeed (2) ____ local residents are willing to participate. Organizers therefore need to make the events accessible and explain how small actions can (3) ____ a wider environmental goal. In the long run, the success of repair cafés may depend less on technology than on the sense of community they (4) ____.","topic":"進階克漏字：篇章語意與搭配","level":6},{"id":"adv-c1-2","num":2,"type":"cloze","q":"Which best fits blank (2)?","opts":["unless","although","because","once"],"ans":0,"explain":"unless 除非；若居民不願參與就無法成功。","passage":"An increasing number of cities are encouraging residents to repair household items instead of discarding them. A repair café, for instance, provides tools and volunteers y misleading headlines.","topic":"進階克漏字：篇章語意與搭配","level":6},{"id":"adv-c2-3","num":3,"type":"cloze","q":"Which best fits blank (3)?","opts":["skepticism","obedience","urgency","certainty"],"ans":0,"explain":"healthy skepticism 健康的懷疑態度。","passage":"When we encounter a surprising statistic online, we may be tempted to share it immediately. Yet numbers rarely explain themselves. A percentage can sound impressive while hiding the fact that the original sample was very small. Before accepting a claim, readers should consider (1) ____ collected the information and how participants were selected. They should also ask whether the figure has been (2) ____ by an independent source. This habit does not mean rejecting every unfamiliar claim; rather, it encourages a healthy degree of (3) ____. By pausing to examine the evidence, readers are less likely to be (4) ____ by misleading headlines.","topic":"進階克漏字：篇章語意與搭配","level":6},{"id":"adv-c2-4","num":4,"type":"cloze","q":"Which best fits blank (4)?","opts":["misled","protected","encouraged","supported"],"ans":0,"explain":"be misled by 被……誤導。","passage":"When we encounter a surprising statistic online, we may be tempted to share it immediately. Yet numbers rarely explain themselves. A percentage can sound impressive while hiding the fact that the original sample was very small. Before accepting a claim, readers should consider (1) ____ collected the information and how participants were selected. They should also ask whether the figure has been (2) ____ by an independent source. This habit does not mean rejecting every unfamiliar claim; rather, it encourages a healthy degree of (3) ____. By pausing to examine the evidence, readers are less likely to be (4) ____ by misleading headlines.","topic":"進階克漏字：篇章語意與搭配","level":6},{"id":"adv-r1-1","num":1,"type":"reading","q":"What concern did the library initially have?","opts":["The expense of advertising the program.","The maintenance of borrowed tools.","A shortage of library books.","A lack of public interest in sewing."],"ans":1,"explain":"原文提到 staff worried ... difficult to maintain。","passage":"A city library introduced a “borrow a tool” program after noticing that residents often purchased equipment they used only once. Members can now borrow drills, ladders, and sewing machines for a few days, just as they borrow books. At first, some staff worried that the equipment would be difficult to maintain. The library responded by offering brief safety demonstrations and requiring borrowers to report damage. Within a year, the program attracted people who had rarely visited the library before. The director believes its greatest value lies not in the money saved but in changing how people think about shared public resources.","topic":"進階閱讀：推論與主旨","level":6},{"id":"adv-r1-2","num":2,"type":"reading","q":"What is the director’s main point?","opts":["The program should replace book lending.","Residents should purchase fewer books.","The program encourages a new view of shared resources.","Only experienced workers should borrow tools."],"ans":2,"explain":"最後一句指出 greatest value 在於改變人們對共享公共資源的看法。","passage":"A city library introduced a “borrow a tool” program after noticing that residents often purchased equipment they used only once. Members can now borrow drills, ladders, and sewing machines for a few days, just as they borrow books. At first, some staff worried that the equipment would be difficult to maintain. The library responded by offering brief safety demonstrations and requiring borrowers to report damage. Within a year, the program attracted people who had rarely visited the library before. The director believes its greatest value lies not in the money saved but in changing how people think about shared public resources.","topic":"進階閱讀：推論與主旨","level":6},{"id":"adv-r2-1","num":1,"type":"reading","q":"Why were some students dissatisfied with group projects?","opts":["They did not understand the topics.","Their results seemed overly dependent on classmates.","They had too many individual tests.","Teachers refused to provide instructions."],"ans":1,"explain":"成績過度受到組員表現影響。","passage":"After a school replaced some of its traditional exams with group projects, teachers noticed an unexpected problem. Although students became more enthusiastic during lessons, some felt that their grades depended too much on their teammates. The school responded by combining group scores with short individual reflections and peer evaluations. This change did not eliminate every disagreement, but it gave teachers more information about each student’s contribution. The experience suggests that changing an assessment method involves more than introducing a new activity; schools must also reconsider what counts as fair evidence of learning.","topic":"進階閱讀：推論與主旨","level":6},{"id":"adv-r2-2","num":2,"type":"reading","q":"Which statement best expresses the passage’s conclusion?","opts":["Students should never work in groups.","Peer evaluations always solve assessment problems.","Fair assessment requires careful design of evidence.","Traditional exams measure every skill accurately."],"ans":2,"explain":"結尾指出改革評量方式也必須重新考量公平的學習證據。","passage":"After a school replaced some of its traditional exams with group projects, teachers noticed an unexpected problem. Although students became more enthusiastic during lessons, some felt that their grades depended too much on their teammates. The school responded by combining group scores with short individual reflections and peer evaluations. This change did not eliminate every disagreement, but it gave teachers more information about each student’s contribution. The experience suggests that changing an assessment method involves more than introducing a new activity; schools must also reconsider what counts as fair evidence of learning.","topic":"進階閱讀：推論與主旨","level":6},{"id":"listen-01","num":1,"type":"listening","q":"When will the group meet?","opts":["Thursday morning","Thursday afternoon","Friday morning","Friday afternoon"],"ans":3,"explain":"男生改訂 Friday afternoon，女生表示同意。","speech":"Woman: Did you reserve the study room for Thursday? Man: I tried, but it was fully booked. I got Friday afternoon instead. Woman: That's fine. I'll tell the others about the change.","level":5},{"id":"listen-02","num":2,"type":"listening","q":"Why can the speakers visit later than usual?","opts":["Admission is free.","A special event extends opening hours.","They have advance tickets.","The museum moved to a new location."],"ans":1,"explain":"特殊活動使博物館今天延長開放到晚上八點。","speech":"Man: The museum closes at five, right? Woman: Usually, but today there's a special event, so it stays open until eight. Man: Great. Then we can go after dinner.","level":5},{"id":"listen-03","num":3,"type":"listening","q":"What caused the man's problem?","opts":["He forgot the assignment.","The library was closed.","His computer needed repair.","He misunderstood the deadline."],"ans":2,"explain":"男生花很多時間修電腦，因此作業幾乎還沒開始。","speech":"Woman: You look tired. Were you studying all night? Man: Not exactly. I spent hours trying to fix my computer, so I barely started the assignment. Woman: The library has computers you can use.","level":5},{"id":"listen-04","num":4,"type":"listening","q":"What must the man do to attend?","opts":["Pay a membership fee.","Bring a student ID tomorrow.","Register online in advance.","Prepare a short presentation."],"ans":2,"explain":"免費但須先線上報名，因為座位有限。","speech":"Man: I thought the workshop was free. Woman: It is for students, but you need to register online first. The number of seats is limited. Man: I'll sign up right away.","level":5},{"id":"listen-05","num":5,"type":"listening","q":"What will the speakers most likely do next?","opts":["Remove all statistics from their report.","Search for the original research.","Publish the article online.","Interview the article's author."],"ans":1,"explain":"兩人認為需要先找到原始研究。","speech":"Woman: The article makes a strong claim, but I couldn't find where the  evidence could not show how much of the improvement came from the software alone. The researchers then designed a study that provided comparable support to both groups. The revised project took longer than expected, yet it helped them ask a more precise question. In science, an unexpected result can be useful when it leads to better explanations and stronger evidence.","topic":"A More Careful Scientific Conclusion","level":5},{"id":"gsatr-3-1","num":1,"type":"reading","q":"Which problem is associated with excessive light?","opts":["Birds become unable to fly at all.","Some animal behavior is disrupted.","Cities cannot install solar panels.","Shops must close before sunset."],"ans":1,"explain":"部分候鳥與昆蟲的活動可能受人造光干擾。","passage":"Artificial light allows people to travel after sunset, but light that escapes into the sky also changes the environment. Some migrating birds rely on natural light cues, and insects may gather around lamps instead of visiting the plants on which they depend. In response, several cities have experimented with lighting that points downward and becomes dimmer when streets are empty. Shop owners initially worried that the changes would make customers feel unsafe. However, surveys conducted after the trial showed little change in visitors' sense of security. Electricity use also fell. These results do not mean that every city should turn off its streetlights. Instead, they suggest that well-designed lighting can meet human needs while reducing unnecessary environmental effects. The question is not simply whether a place should be bright or dark, but when, where, and how lighting is used.","topic":"Making Cities Safer for Wildlife","level":5},{"id":"gsatr-3-2","num":2,"type":"reading","q":"What did the lighting trial involve?","opts":["Removing every outdoor lamp","Using brighter advertising signs","Directing light downward and adjusting brightness","Prohibiting people from traveling at night"],"ans":2,"explain":"嘗試改變照射方向，並在無人時調暗。","passage":"Artific // 將所有試題空格標記移除再交給語音合成，避免把底線讀成 underscore / score。
// 一律保留未填答文章；沒有任何答案資料會送進朗讀功能。
let clozeReadToken=0;
function cleanSpeechText(raw){
  return String(raw||'')
    .replace(/[（(]\s*\d+\s*[)）]\s*[_＿﹍‗]{2,}/g, ', ')
    .replace(/\[\s*\d+\s*\]\s*[_＿﹍‗]{2,}/g, ', ')
    .replace(/[_＿﹍‗]{2,}/g, ', ')
    .replace(/[（(]\s*\d+\s*[)）]\s*(?=[,.;!?])/g, '')
    .replace(/\s+,/g, ',')
    .replace(/,{2,}/g, ',')
    .replace(/\s+/g, ' ').trim();
}
function speak(s){
  clozeReadToken++;
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援朗讀');return}
  speechSynthesis.cancel();
  const text=cleanSpeechText(s);
  if(!text)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.85;
  speechSynthesis.speak(u);
}
function speakCloze(passage){
  clozeReadToken++;
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援朗讀');return}
  speechSynthesis.cancel();
  // 單次朗讀：以逗號標示自然停頓；底線與題號完全不傳給語音引擎。
  const text=cleanSpeechText(passage);
  if(!text)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.85;
  speechSynthesis.speak(u);
}

function vocabPage(){let cards=DATA.cards.filter(w=>w.level===view.level),done=cards.filter(w=>state.learned[w.word]).length;return `<section class="section"><div class="eyebrow">VOCABULARY ISLAND</div><h2>🌱 六級單字島</h2><p class="muted">高中學測建議先選 Level 3～5，以句子語境選字、朗讀及拼字練習。Level 6 提供延伸挑戰；本網站級別為教學建議，並非官方逐字核對。新增的 800 字先提供中文釋義與發音；已有例句的 1,200 字可練語境選字，其他單字先練詞義及拼字。</p><div class="controls"><label for="level">選擇難度</label><select id="level" onchange="view.level=+this.value;draw()">${Array.from({length:6},(_,i)=>`<option value="${i+1}" ${view.level===i+1?'selected':''}>Level ${i+1}</option>`).join('')}</select><span class="tag">本級 ${cards.length} 字</span><span class="muted small">已學會 ${done}/${cards.length}</span><button class="btn soft" onclick="switchTab('spelling')">⌨️ 練拼字</button><label for="vocabCount">每次題數</label><select id="vocabCount" onchange="view.wordCount=+this.value">${[10,20,50,100].map(n=>`<option value="${n}" ${(view.wordCount||10)===n?'selected':''}>${n} 題</option>`).join('')}</select><button class="btn primary" onclick="startVocab()">測驗本級單字</button></div><div class="cardGrid">${cards.map(w=>`<div class="wordCard"><span class="tag">L${w.level}</span>${state.spelling[w.word]?`<span class="wordStatus">✏️ 拼字練過 ${state.spelling[w.word].tries} 次</span>`:''}<h3>${esc(w.word)}</h3><div><b>${esc(w.zh)}</b></div>${w.example?`<div class="example">${esc(w.example)}</div>`:""}${w.chunk?`<div class="example"><strong>常見語塊：</strong> ${esc(w.chunk)}<div class="small muted">${esc(w.chunkZh||"")}</div></div>`:""}<div class="buttons"><button class="btn soft" onclick="speak(${JSON.stringify(w.word).replaceAll('"','&quot;')})">🔊 單字</button>${w.example?`<button class="btn" onclick="speak(${JSON.stringify(w.example).replaceAll('"','&quot;')})">🔊 例句</button>`:""}<button class="btn ${state.learned[w.word]?'green':''}" onclick="toggleWord('${w.word}')">${state.learned[w.word]?'✓ 已學會':'○ 標記學會'}</button></div></div>`).join('')}</div></section>`}

function hashShuffle(a){let out=a.slice();for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function startVocab(){let list=DATA.cards.filter(w=>w.level===view.level);let items=buildWordQuiz(list,view.wordCount||10);startQuiz(items,`Level ${view.level} 單字測驗 · ${items.length} 題`)}
function buildWordQuiz(list,count=10){
 const bank=DATA.cards;
 return hashShuffle(list).slice(0,Math.min(count,list.length)).map((w,i)=>{
   const source=(w.example||'').trim();
   const escaped=w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   const pattern=new RegExp('\\b'+escaped+'\\b','i');
   const hasContext=pattern.test(source);
   const nearby=bank.filter(x=>x.word!==w.word&&x.level===w.level&&x.zh!==w.zh);
   let distract=hashShuffle(nearby).slice(0,3);
   if(distract.length<3)distract=distract.concat(hashShuffle(bank.filter(x=>x.word!==w.word&&!distract.includes(x))).slice(0,3-distract.length));
   const options=hashShuffle([w,...distract]);
   return {id:'word:'+w.word,num:i+1,type:'word',q:hasContext?source.replace(pattern,'____')+'\nChoose the most suitable word.':`${w.zh} 的英文是哪一個？`,opts:options.map(x=>x.word),ans:options.findIndex(x=>x.word===w.word),explain:`${w.word}：${w.zh}。${source?"例句："+source:""}`,speech:null};
 });
}

 return `<section class="section"><div class="eyebrow">SPELLING GAME · LEVEL ${view.level}</div><div class="panel spellCard"><div class="small muted">第 ${g.at+1} / ${g.words.length} 題　｜　本輪答對 ${g.correct} 題</div><div class="progressTrack"><div class="progressBar" style="width:${100*g.at/g.words.length}%"></div></div><div class="spellPrompt">${esc(w.zh)}</div><button class="btn soft" onclick="speakSpell()">🔊 聽單字發音</button><p class="muted small">${esc('請依中文意思及發音輸入英文；不需輸入標點。')}</p><form onsubmit="spellingCheck();return false"><input id="spellInput" class="spellInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡輸入英文拼字" ${g.checked?'disabled':''} aria-label="輸入英文拼字"><div class="spellControls">${g.checked?`<button class="btn primary" type="button" onclick="spellingNext()">${g.at+1===g.words.length?'查看成績':'下一題 →'}</button>`:`<button class="btn primary" type="submit">檢查拼字</button>`}<button class="btn" type="button" onclick="speakSpell()">重播發音</button></div></form>${g.checked?`<div class="spellFeedback"><strong>${g.lastOK?'✅ 拼對了！':'📝 再記住這個拼法：'} ${esc(w.word)}</strong><div>${esc(w.example)}</div><div class="muted small">這個單字曾練習 ${rec?.tries||1} 次</div></div>`:''}</div></section>`;
}
function speakSpell(){if(spellGame&&spellGame.at<spellGame.words.length)speak(spellGame.words[spellGame.at].word)}
function spellingCheck(){
 const g=spellGame;if(!g||g.checked||g.at>=g.words.length)return;
 const val=el('spellInput')?.value?.trim().toLowerCase().replace(/\s+/g,' ');if(!val){alert('請先輸入英文拼字。');return}
 const w=g.words[g.at],ok=val===w.word.trim().toLowerCase();g.checked=true;g.lastOK=ok;g.correct+=ok?1:0;g.answered++;
 const r=state.spelling[w.word]||{tries:0,correct:0};r.tries++;r.correct+=ok?1:0;r.lastCorrect=ok;r.last=Date.now();state.spelling[w.word]=r;
 save();draw();
}

function groupByPassage(list){let groups=[],seen=new Set();for(let q of list){if(q.passage){let k=q.type+'|'+q.passage;if(seen.has(k))continue;seen.add(k);groups.push(list.filter(x=>x.type===q.type&&x.passage===q.passage))}else groups.push([q])}return groups}
function startType(t,mode){let items=DATA.weeks.flatMap(w=>w.questions).filter(q=>q.type===t&&(typeof mode!=='number'||Number(q.id.slice(0,2))===mode));if(mode==='random'){let groups=groupByPassage(items);let g=groups[Math.floor(Math.random()*groups.length)];items=t==='grammar'?hashShuffle(items).slice(0,10):g}else if(mode==='all'){items=items}startQuiz(items,`${kind(t)} · ${typeof mode==='number'?'Week '+String(mode).padStart(2,'0'):mode==='random'?'隨機練習':'完整題庫'}`)}

function pastExamPage(){
 const buttons=[115,114,113,112,111,110].map(y=>`<a class="btn soft" target="_blank" rel="noopener noreferrer" href="${PASTEXAM_URL}">${y} 年官方試題與答案 ↗</a>`).join('');
 return `<section class="section"><div class="eyebrow">GSAT ENGLISH · OFFICIAL SOURCES</div><h2>📚 110～115 學測英文歷屆試題</h2><p class="muted">按下年度連結，將開啟大考中心官方「一般試題」索引。請在頁面選擇年度與英文考科，再下載試題與答案。本站不複製官方試卷全文。</p><div class="panel"><div class="pastYears">${buttons}</div><a class="btn" target="_blank" rel="noopener noreferrer" href="${PASTSTYLE_URL}">115 學年度起適用官方參考試卷與說明 ↗</a></div><div class="panel"><h3>🧠 115 新式篇章結構（原創模擬）</h3><p>每篇文章 4 個空格，共用 A～E 五個選項，其中有 1 個多餘選項。每個選項只能使用一次。</p><p class="small muted">本站舊篇章結構題是四選一模擬練習；這一區才是依 115 新制的五選項題組設計。</p><div class="buttons"><button class="btn" onclick="switchPastSet(0)">第一篇</button><button class="btn" onclick="switchPastSet(1)">第二篇</button></div><div id="pastPractice">${pastPracticeHTML()}</div></div><p class="help">本站聽力練習屬額外能力訓練；正式學測英文考科並不設獨立聽力題型。</p></section>`;
}
function switchPastSet(i){pastSet=i;pastPicks={};pastMarked=false;let x=el('pastPractice');if(x)x.innerHTML=pastPracticeHTML()}
function pastPracticeHTML(){
 const q=pastExercise[pastSet];const answers=q.options.map((opt,i)=>`<div class="pastChoice"><strong>${'ABCDE'[i]}.</strong> ${esc(opt)}</div>`).join('');
 const fields=[0,1,2,3].map(i=>`<label class="pastAnswer"><b>空格 ${i+1}</b><select aria-label="空格 ${i+1}" ${pastMarked?'disabled':''} onchange="pastPicks[${i}]=this.value"><option value="">選擇</option>${['A','B','C','D','E'].map((k,j)=>`<option value="${j}" ${String(pastPicks[i])===String(j)?'selected':''}>${k}</option>`).join('')}</select>${pastMarked?`<strong>${Number(pastPicks[i])===q.answers[i]?'✅ 正確':'❌ 正解 '+ 'ABCDE'[q.answers[i]]}</strong>`:''}</label>`).join('');
 const explanations=pastMarked?`<div class="explanation"><h3>中文解析</h3>${q.explanations.map((x,i)=>`<p>空格 ${i+1}：${'ABCDE'[q.answers[i]]}　${esc(x)}</p>`).join('')}<p>未使用選項：E</p></div>`:'';
 return `<h3>${q.title}</h3><div class="pastArticle"><div class="tag">📖 文章與答案選項同區顯示</div><p>${esc(q.passage)}</p><button class="btn soft" onclick="speakCloze(${JSON.stringify(q.passage).replaceAll('"','&quot;')})">🔊 朗讀文章（空格停頓）</button></div><div class="pastChoices">${answers}</div><div class="pastAnswerGrid">${fields}</div><div class="buttons">${pastMarked?'<button class="btn" onclick="switchPastSet(pastSet)">重新作答</button>':'<button class="btn primary" onclick="gradePast()">批改四個空格</button>'}</div>${explanations}`;
}
function gradePast(){
 const v=[0,1,2,3].map(i=>pastPicks[i]);if(v.some(x=>x===undefined||x==='')){alert('請先完成四個空格');return}
 if(new Set(v).size!==4){alert('五個選項不可重複使用');return}
 const q=pastExercise[pastSet],good=v.filter((x,i)=>Number(x)===q.answers[i]).length;
 state.sessions.push({at:new Date().toISOString(),title:'115 新式篇章結構：'+q.title,total:4,correct:good});
 state.settings['past115_'+pastSet]={score:good,at:Date.now()};save();
 pastMarked=true;el('pastPractice').innerHTML=pastPracticeHTML();
}

function structurePage(){const qs=EXTRA.filter(q=>q.type==='structure'),groups=groupByPassage(qs);return `<section class="section"><div class="eyebrow">GSAT COHERENCE</div><h2>🧠 篇章結構島</h2><p class="muted">依上下文選出最合適的句子。每篇四題，手機文章與選項同區呈現，利用「下一題」切換。</p><div class="buttons"><button class="btn primary" onclick="startQuiz(EXTRA.filter(q=>q.type==='structure'),'篇章結構 · 完整練習')">全部 ${qs.length} 題</button></div><div class="weekGrid">${groups.map((g,i)=>`<button class="week" onclick="startStructureGroup(${i})">第 ${i+1} 篇 · 四題<span class="statusLabel">${questionStatus(g.map(x=>x.id))}</span></button>`).join('')}</div></section>`}
function startStructureGroup(i){const groups=groupByPassage(EXTRA.filter(q=>q.type==='structure'));if(groups[i])startQuiz(groups[i],'篇章結構 · 第 '+(i+1)+' 篇')}
function advancedPage(t){const all=EXTRA.filter(q=>q.type===t);const groups=groupByPassage(all);return `<section class="section"><h2>🌟 進階${kind(t)}挑戰</h2><p class="muted">題目較著重語境、推論與高中高階文法；並非官方學測題庫。</p><div class="buttons"><button class="btn primary" onclick="startQuiz(EXTRA.filter(q=>q.type==='${t}'),'進階${kind(t)}練習')">開始練習（${all.length} 題）</button></div></section>`}
function questionStatus(ids){
 const count=ids.filter(id=>state.results[id]&&state.results[id].chosen!==null&&state.results[id].chosen!==undefined).length;
 return count===ids.length?'✓ 已完成':count?`已做過 ${count}/${ids.length}`:'○ 未練習';
}
function weekStatus(w,t){const items=w.questions.filter(q=>!t||q.type===t);return questionStatus(items.map(q=>q.id))}
function openWeeks(){tab='home';draw();el('app').insertAdjacentHTML('beforeend',`<section class="section"><h2>📅 25 週完整題庫</h2><p class="muted">每週 20 題，包含詞彙 10、文法 4、克漏字 4、閱讀 2。共用文章一次顯示完整題組。</p><div class="weekGrid">${DATA.weeks.map(w=>`<button class="week" onclick="startQuiz(DATA.weeks[${w.week-1}].questions,'Week ${String(w.week).padStart(2,'0')} · 20 題')">Week ${String(w.week).padStart(2,'0')}<span class="statusLabel">${weekStatus(w)}</span></button>`).join('')}</div></section>`);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function startQuiz(qs,title){if(title.startsWith('今日 10 題')&&qs.length!==10){alert('每日練習題數異常：'+qs.length+' 題');return}view.quiz={items:qs,answers:{},graded:false,title};el('app').innerHTML=quizPage();window.scrollTo({top:0,behavior:'instant'})}
function pick(id,index){let v=view.quiz;if(!v||v.graded)return;v.answers[id]=index;let node=el('q-'+id);if(node){node.querySelectorAll('.option').forEach((b,i)=>b.classList.toggle('selected',i===index))}let count=Object.keys(v.answers).length;el('quizStatus').textContent=`已作答 ${count} / ${v.items.length} 題`;el('quizBar').style.width=(100*count/v.items.length)+'%'}
function grade(){let v=view.quiz;if(!v||v.graded)return;let missing=v.items.length-Object.keys(v.answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，要直接批改嗎？`))return;v.graded=true;let good=0;for(let q of v.items){let chosen=v.answers[q.id],ok=chosen===q.ans;if(ok)good++;if(chosen!==undefined){state.results[q.id]={correct:ok,last:Date.now(),chosen};if(ok)delete state.wrong[q.id];else state.wrong[q.id]=true}}state.sessions.push({at:new Date().toISOString(),title:v.title,total:v.items.length,correct:good});if(state.sessions.length>500)state.sessions=state.sessions.slice(-500);save();el('app').innerHTML=quizPage();window.scrollTo({top:0,behavior:'smooth'})}
function quizPage(){let v=view.quiz;if(!v)return '';let done=Object.keys(v.answers).length,good=v.graded?v.items.filter(q=>v.answers[q.id]===q.ans).length:0;let groups=groupByPassage(v.items);return `<section class="section quiz"><div class="eyebrow">PRACTICE · ${esc(v.title)}</div><div class="quizHead"><h2>${esc(v.title)}</h2><button class="btn" onclick="view.quiz=null;draw()">返回學習島</button></div><div id="quizStatus" class="muted">${v.graded?`答對 ${good}/${v.items.length} 題 · ${Math.round(100*good/v.items.length)} 分`:`已作答 ${done} / ${v.items.length} 題`}</div><div class="progressTrack"><div id="quizBar" class="progressBar" style="width:${100*done/v.items.length}%"></div></div>${groups.map(gr=>groupHTML(gr,v)).join('')}<div class="panel"><div class="buttons">${v.graded?`<button class="btn primary" onclick="retryWrong()">重練本次錯題</button><button class="btn" onclick="view.quiz=null;draw()">完成返回</button>`:`<button class="btn primary" onclick="grade()">交卷並查看解析</button><button class="btn" onclick="view.quiz=null;draw()">暫時離開</button>`}</div><p class="small muted">${v.graded?'已將作答結果保存至本機紀錄。':'完成後會顯示正確答案與中文簡析。未交卷前不記錄本次成績。'}</p></div></section>`}
function groupHTML(gr,v){
 const p=gr[0].passage;
 const shared=Boolean(p),cloze=shared&&(gr[0].type==='cloze'||gr[0].type==='structure');
 const source=shared?`<div class="readingSource"><div class="tag">${kind(gr[0].type)} · 共同文章 · ${gr.length} 題</div><div class="muted small">${esc(gr[0].topic||'')}</div><details class="passageDetails" open><summary>📖 文章（點此展開／收合）</summary><div class="passage">${esc(p)}</div></details><button class="btn soft readBtn" onclick="${cloze?'speakCloze':'speak'}(${JSON.stringify(p).replaceAll('"','&quot;')})">🔊 朗讀文章${cloze?'（空格停頓）':''}</button></div>`:'';
 const qs=gr.map((q,gi)=>{
 const sel=v.answers[q.id],isListening=q.type==='listening';
 return `<div id="q-${q.id}" class="${shared?'subquestion':'singleQuestion'} ${cloze&&gi===0?'activeCloze':''}">${!shared?`<div class="tag">${kind(q.type)}</div>`:''}<div class="small muted">${q.id.startsWith('listen-')?'聽力題':q.id.startsWith('adv-')?'進階題':'第 '+q.num+' 題 · Week '+q.id.slice(0,2)}</div>${isListening?`<button class="btn soft listenButton" onclick="speakListening(${JSON.stringify(q.speech).replaceAll('"','&quot;')})">▶ 播放英文內容</button><p class="small muted">交卷前不會顯示聽力逐字稿。</p>`:''}<h3>${esc(q.q)}</h3>${!shared&&!isListening&&q.type!=='word'?`<button class="btn soft" style="margin-bottom:12px" onclick="speak(${JSON.stringify(q.speech||q.q).replaceAll('"','&quot;')})">🔊 朗讀題目</button>`:''}<div class="optionGrid">${q.opts.map((o,i)=>`<button class="option ${sel===i?'selected':''} ${v.graded?(i===q.ans?'correct':sel===i?'wrong':''):''}" ${v.graded?'disabled':''} onclick="pick('${q.id}',${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${v.graded?`<div class="explanation"><strong>${sel===q.ans?'✅ 答對':'📝 答案：'+('ABCD'[q.ans])}</strong><div>${esc(q.explain||'')}</div>${isListening?`<details><summary>查看英文逐字稿</summary><p>${esc(q.speech)}</p></details>`:''}</div>`:''}</div>`}).join('');
 const gid=gr[0].id;
 const nav=cloze?`<div class="clozeStepNav" data-group="${gid}"><button class="btn" onclick="clozeStep('${gid}',-1)">← 上一題</button><span class="clozeStepCount" id="count-${gid}">第 1 / ${gr.length} 題</span><button class="btn primary" onclick="clozeStep('${gid}',1)">下一題 →</button></div>`:'';
 return `<div class="question ${shared?'sharedQuestion':''} ${cloze?'clozeQuestion':''}" id="group-${gid}">${shared?`<div class="sharedLayout">${source}<div class="sharedOptions"><div class="small muted">${cloze?'📱 手機版：文章與目前題目放在同一畫面，使用下一題切換':'共同文章'} · 共 ${gr.length} 題</div>${qs}${nav}</div></div>`:qs}</div>`;
}
function clozeStep(gid,delta){
 const root=el('group-'+gid);if(!root)return;
 const questions=Array.from(root.querySelectorAll('.subquestion'));
 let at=questions.findIndex(x=>x.classList.contains('activeCloze'));
 if(at<0)at=0;
 const next=Math.max(0,Math.min(questions.length-1,at+delta));
 questions.forEach((q,i)=>q.classList.toggle('activeCloze',i===next));
 const label=el('count-'+gid);if(label)label.textContent=`第 ${next+1} / ${questions.length} 題`;
}
function retryWrong(){let v=view.quiz,items=v.items.filter(q=>v.answers[q.id]!==q.ans);if(!items.length){alert('本次全部答對！');return}let included=groupByPassage(v.items).filter(g=>g.some(q=>items.includes(q))).flat();startQuiz(included,'本次錯題重練（文章保留完整題組）')}
function reviewPage(){let ids=Object.keys(state.wrong),q=ids.map(id=>BYID[id]).filter(Boolean),word=ids.filter(id=>id.startsWith('word:'));let groups=groupByPassage(q);let originals=groups.map(g=>g[0]);return `<section class="section"><div class="eyebrow">REVIEW</div><h2>🔁 錯題複習</h2><p class="muted">目前有 ${ids.length} 題待複習。克漏字或閱讀若有錯題，複習時會自動帶入同篇文章的完整題組。</p><div class="buttons"><button class="btn primary" ${!q.length?'disabled':''} onclick="startReview()">開始重練選擇題</button>${word.length?`<button class="btn soft" onclick="startWrongWords()">重練錯誤單字</button>`:''}</div>${q.length?`<div class="panel"><h3>需複習的題型</h3>${['vocab','grammar','cloze','reading','listening'].map(t=>`<p>${kind(t)}：${q.filter(x=>x.type===t).length} 題</p>`).join('')}</div>`:'<div class="empty">目前沒有需要重練的選擇題。可以先去單字島或今天的練習開始！</div>'}</section>`}
function startWrongWords(){let words=DATA.cards.filter(w=>state.wrong['word:'+w.word]);if(!words.length){alert('目前沒有單字錯題');return}startQuiz(buildWordQuiz(words),'錯誤單字重練')}
function startReview(){let base=ALL.filter(q=>state.wrong[q.id]),groups=groupByPassage(ALL);let full=groups.filter(g=>g.some(q=>base.includes(q))).flat();startQuiz(full,'錯題複習 · 共同文章完整呈現')}
function progressPage(){let a=totals(),s=state.sessions.slice(-20).reverse();return `<section class="section"><div class="eyebrow">MY PROGRESS</div><h2>📈 我的學習紀錄</h2><div class="metrics"><div class="metric"><b>${a.attempted}</b>題已練習</div><div class="metric"><b>${a.rate}%</b>題目最新正確率</div><div class="metric"><b>${a.learned}</b>字已學會</div><div class="metric"><b>${state.sessions.length}</b>次已交卷</div><div class="metric"><b>${Object.values(state.spelling||{}).reduce((a,b)=>a+b.tries,0)}</b>次拼字練習</div></div><div class="panel section"><h3>最近的交卷紀錄</h3>${s.length?s.map(x=>`<div style="display:flex;justify-content:space-between;gap:9px;border-bottom:1px solid var(--line);padding:8px 0"><span>${esc(x.title)}<div class="muted small">${new Date(x.at).toLocaleString('zh-TW')}</div></span><b>${x.correct}/${x.total}</b></div>`).join(''):'<p class="muted">尚未交卷，完成一次測驗後會出現在這裡。</p>'}</div><div class="panel"><h3>備份與管理</h3><p class="muted">所有進度保存在目前瀏覽器的 localStorage；換裝置、清除網站資料或某些離線檔案環境可能導致紀錄無法沿用。建議定期匯出。</p><div class="buttons"><button class="btn primary" onclick="exportJSON()">匯出進度 JSON</button><button class="btn soft" onclick="exportCSV()">匯出成績 CSV</button><label class="btn">匯入進度 JSON <input type="file" accept="application/json,.json" style="display:none" onchange="importJSON(this)"></label><button class="btn" onclick="clearAll()">清除本機紀錄</button></div></div></section>`}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('學測英文練習島_進度.json',JSON.stringify({app:'gsat_learning_island_v2',exported:new Date().toISOString(),data:state},null,2),'application/json')}
function exportCSV(){let rows=[['日期','測驗','答對','總題數','正確率'],...state.sessions.map(s=>[s.at,s.title,s.correct,s.total,Math.round(100*s.correct/s.total)+'%'])];download('學測英文練習島_成績.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(input){try{let o=JSON.parse(await input.files[0].text());if(o.app!=='gsat_learning_island_v2'||!o.data||!o.data.results||!o.data.sessions)throw Error('不是本網站匯出的進度格式');if(!confirm('要用匯入檔案覆蓋這個瀏覽器目前的進度嗎？'))return;state={...o.data,spelling:o.data.spelling||{}};save();draw();alert('匯入完成')}catch(e){alert('匯入失敗：'+e.message)}}
function clearAll(){if(confirm('確定清除所有作答與學習進度嗎？此動作無法復原，請先匯出備份。')){state={results:{},wrong:{},learned:{},sessions:[],settings:{},spelling:{}};spellGame=null;save();draw()}}
window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});draw();
</script></body></html>
