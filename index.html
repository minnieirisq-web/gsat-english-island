const ALL=DATA.weeks.flatMap(w=>w.questions);

const STORE='gsat_learning_island_v2';
let state=load(),tab='home',view={level:1,mode:'vocab',index:0,quiz:null,filter:'all'};
function load(){try{let o=JSON.parse(localStorage.getItem(STORE)||'{}');return {results:o.results||{},wrong:o.wrong||{},learned:o.learned||{},sessions:o.sessions||[],settings:o.settings||{}}}catch(e){return {results:{},wrong:{},learned:{},sessions:[],settings:{}}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){alert('瀏覽器無法保存進度，請使用「匯出紀錄」備份。')}}
function el(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// 將所有試題空格標記移除再交給語音合成，避免把底線讀成 underscore / score。
// 一律保留未填答文章；沒有任何答案資料會送進朗讀功能。
let clozeReadToken=0;
function cleanSpeechText(raw){
  return String(raw||'')
    .replace(/[（(]\s*\d+\s*[)）]\s*[_＿﹍‗]{2,}/g, ', ')
    .replace(/\[\s*\d+\s*\]\s*[_＿﹍‗]{2,}/g, ', ')
    .replace(/[_＿﹍‗]{2,}/g, ', ')
    .replace(/[（(]\s*\d+\s*[)）]\s*(?=[,.;!?])/g, '')
    .replace(/\s+,/g, ',')
    .replace(/,{2,}/g, ',')
    .replace(/\s+/g, ' ').trim();
}
function speak(s){
  clozeReadToken++;
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援朗讀');return}
  speechSynthesis.cancel();
  const text=cleanSpeechText(s);
  if(!text)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.85;
  speechSynthesis.speak(u);
}
function speakCloze(passage){
  clozeReadToken++;
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援朗讀');return}
  speechSynthesis.cancel();
  // 單次朗讀：以逗號標示自然停頓；底線與題號完全不傳給語音引擎。
  const text=cleanSpeechText(passage);
  if(!text)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.85;
  speechSynthesis.speak(u);
}
function kind(t){return {vocab:'單字題',grammar:'文法題',cloze:'克漏字',reading:'閱讀理解'}[t]||t}
function switchTab(t){clozeReadToken++;if('speechSynthesis' in window)speechSynthesis.cancel();tab=t;view.quiz=null;draw();window.scrollTo({top:0,behavior:'instant'})}
function navbar(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function draw(){navbar();let content=({home:homePage,vocab:vocabPage,grammar:()=>typePage('grammar'),cloze:()=>typePage('cloze'),reading:()=>typePage('reading'),review:reviewPage,progress:progressPage})[tab]();el('app').innerHTML=content}
function totals(){let attempted=Object.keys(state.results).length,correct=Object.values(state.results).filter(v=>v.correct).length;return {attempted,correct,rate:attempted?Math.round(100*correct/attempted):0,learned:Object.values(state.learned).filter(Boolean).length}}

function vocabPage(){let cards=DATA.cards.filter(w=>w.level===view.level),done=cards.filter(w=>state.learned[w.word]).length;return `<section class="section"><div class="eyebrow">VOCABULARY ISLAND</div><h2>🌱 六級單字島</h2><p class="muted">先聽發音，再看中文、例句；可標記已學會，或從同級單字練習選擇題。</p><div class="controls"><label for="level">選擇難度</label><select id="level" onchange="view.level=+this.value;draw()">${Array.from({length:6},(_,i)=>`<option value="${i+1}" ${view.level===i+1?'selected':''}>Level ${i+1}</option>`).join('')}</select><span class="tag">本級 ${cards.length} 字</span><span class="muted small">已學會 ${done}/${cards.length}</span><button class="btn primary" onclick="startVocab()">測驗本級單字</button></div><div class="cardGrid">${cards.map(w=>`<div class="wordCard"><span class="tag">L${w.level}</span><h3>${esc(w.word)}</h3><div><b>${esc(w.zh)}</b></div><div class="example">${esc(w.example)}</div><div class="buttons"><button class="btn soft" onclick="speak(${JSON.stringify(w.word).replaceAll('"','&quot;')})">🔊 單字</button><button class="btn" onclick="speak(${JSON.stringify(w.example).replaceAll('"','&quot;')})">🔊 例句</button><button class="btn ${state.learned[w.word]?'green':''}" onclick="toggleWord('${w.word}')">${state.learned[w.word]?'✓ 已學會':'○ 標記學會'}</button></div></div>`).join('')}</div></section>`}
function toggleWord(w){state.learned[w]=!state.learned[w];save();draw()}
function hashShuffle(a){let out=a.slice();for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function startVocab(){let list=DATA.cards.filter(w=>w.level===view.level);let items=buildWordQuiz(list);startQuiz(items,`Level ${view.level} 單字測驗`)}
function buildWordQuiz(list){let bank=DATA.cards;return hashShuffle(list).slice(0,Math.min(10,list.length)).map((w,i)=>{let distract=hashShuffle(bank.filter(x=>x.word!==w.word&&x.zh!==w.zh)).slice((i*3)%Math.max(1,bank.length-6),(i*3)%Math.max(1,bank.length-6)+3);if(distract.length<3)distract=bank.filter(x=>x.word!==w.word).slice(0,3);let options=hashShuffle([w,...distract]);return {id:'word:'+w.word,num:i+1,type:'word',q:`${w.word} 的中文意思是？`,opts:options.map(x=>x.zh),ans:options.findIndex(x=>x.word===w.word),explain:`${w.word}：${w.zh}。例句：${w.example}`,speech:w.example}})}
function typePage(t){let list=ALL.filter(q=>q.type===t),name=kind(t),qty=t==='cloze'?'25 篇文章（共 100 題）':t==='reading'?'25 篇文章（共 50 題）':'100 題';return `<section class="section"><div class="eyebrow">PRACTICE ISLAND</div><h2>${{grammar:'📝',cloze:'🧩',reading:'📖'}[t]} ${name}島</h2><p class="muted">題庫：${qty}。可以依週次練習，也可以抽題；每份克漏字都會一次出現文章與四題。</p><div class="buttons"><button class="btn primary" onclick="startType('${t}','random')">${t==='cloze'?'抽 1 篇文章':t==='reading'?'抽 1 篇短文':'抽 10 題練習'}</button><button class="btn soft" onclick="startType('${t}','all')">${t==='cloze'?'全部 25 篇':t==='reading'?'全部 25 篇':'全部 100 題'}</button></div><h3>依週次練習</h3><div class="weekGrid">${DATA.weeks.map(w=>`<button class="week" onclick="startType('${t}',${w.week})">Week ${String(w.week).padStart(2,'0')}<div class="small muted">${t==='grammar'?'4 題':t==='cloze'?'4 題': '2 題'}</div></button>`).join('')}</div></section>`}
function groupByPassage(list){let groups=[],seen=new Set();for(let q of list){if(q.passage){let k=q.type+'|'+q.passage;if(seen.has(k))continue;seen.add(k);groups.push(list.filter(x=>x.type===q.type&&x.passage===q.passage))}else groups.push([q])}return groups}
function startType(t,mode){let items=ALL.filter(q=>q.type===t&&(typeof mode!=='number'||Number(q.id.slice(0,2))===mode));if(mode==='random'){let groups=groupByPassage(items);let g=groups[Math.floor(Math.random()*groups.length)];items=t==='grammar'?hashShuffle(items).slice(0,10):g}else if(mode==='all'){items=items}startQuiz(items,`${kind(t)} · ${typeof mode==='number'?'Week '+String(mode).padStart(2,'0'):mode==='random'?'隨機練習':'完整題庫'}`)}
function startDaily(){let a=hashShuffle(ALL.filter(q=>q.type==='vocab')).slice(0,3),b=hashShuffle(ALL.filter(q=>q.type==='grammar')).slice(0,2);let cg=groupByPassage(ALL.filter(q=>q.type==='cloze'));let c=cg[Math.floor(Math.random()*cg.length)];let rg=groupByPassage(ALL.filter(q=>q.type==='reading'));let r=rg[Math.floor(Math.random()*rg.length)].slice(0,1);startQuiz([...a,...b,...c,...r],'今日 10 題 · 含完整克漏字題組')}
function openWeeks(){tab='home';draw();el('app').insertAdjacentHTML('beforeend',`<section class="section"><h2>📅 25 週完整題庫</h2><p class="muted">每週 20 題，包含詞彙 10、文法 4、克漏字 4、閱讀 2。共用文章一次顯示完整題組。</p><div class="weekGrid">${DATA.weeks.map(w=>`<button class="week" onclick="startQuiz(DATA.weeks[${w.week-1}].questions,'Week ${String(w.week).padStart(2,'0')} · 20 題')">Week ${String(w.week).padStart(2,'0')}</button>`).join('')}</div></section>`);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function startQuiz(qs,title){view.quiz={items:qs,answers:{},graded:false,title};el('app').innerHTML=quizPage();window.scrollTo({top:0,behavior:'instant'})}
function pick(id,index){let v=view.quiz;if(!v||v.graded)return;v.answers[id]=index;let node=el('q-'+id);if(node){node.querySelectorAll('.option').forEach((b,i)=>b.classList.toggle('selected',i===index))}let count=Object.keys(v.answers).length;el('quizStatus').textContent=`已作答 ${count} / ${v.items.length} 題`;el('quizBar').style.width=(100*count/v.items.length)+'%'}
function grade(){let v=view.quiz;if(!v||v.graded)return;let missing=v.items.length-Object.keys(v.answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，要直接批改嗎？`))return;v.graded=true;let good=0;for(let q of v.items){let chosen=v.answers[q.id],ok=chosen===q.ans;if(ok)good++;state.results[q.id]={correct:ok,last:Date.now(),chosen:chosen??null};if(ok)delete state.wrong[q.id];else state.wrong[q.id]=true}state.sessions.push({at:new Date().toISOString(),title:v.title,total:v.items.length,correct:good});if(state.sessions.length>500)state.sessions=state.sessions.slice(-500);save();el('app').innerHTML=quizPage();window.scrollTo({top:0,behavior:'smooth'})}
function quizPage(){let v=view.quiz;if(!v)return '';let done=Object.keys(v.answers).length,good=v.graded?v.items.filter(q=>v.answers[q.id]===q.ans).length:0;let groups=groupByPassage(v.items);return `<section class="section quiz"><div class="eyebrow">PRACTICE · ${esc(v.title)}</div><div class="quizHead"><h2>${esc(v.title)}</h2><button class="btn" onclick="view.quiz=null;draw()">返回學習島</button></div><div id="quizStatus" class="muted">${v.graded?`答對 ${good}/${v.items.length} 題 · ${Math.round(100*good/v.items.length)} 分`:`已作答 ${done} / ${v.items.length} 題`}</div><div class="progressTrack"><div id="quizBar" class="progressBar" style="width:${100*done/v.items.length}%"></div></div>${groups.map(gr=>groupHTML(gr,v)).join('')}<div class="panel"><div class="buttons">${v.graded?`<button class="btn primary" onclick="retryWrong()">重練本次錯題</button><button class="btn" onclick="view.quiz=null;draw()">完成返回</button>`:`<button class="btn primary" onclick="grade()">交卷並查看解析</button><button class="btn" onclick="view.quiz=null;draw()">暫時離開</button>`}</div><p class="small muted">${v.graded?'已將作答結果保存至本機紀錄。':'完成後會顯示正確答案與中文簡析。未交卷前不記錄本次成績。'}</p></div></section>`}
function groupHTML(gr,v){let p=gr[0].passage;return `<div class="question">${p?`<div class="tag">${kind(gr[0].type)} · 共同文章 · ${gr.length} 題</div><p class="small muted">這篇文章有 ${gr.length} 題，全部選項都在下方，請依序作答。</p><div class="muted small">${esc(gr[0].topic||'')}</div><div class="passage">${esc(p)}</div><button class="btn soft" onclick="speakCloze(${JSON.stringify(p).replaceAll('"','&quot;')})">🔊 朗讀文章（空格不唸）</button>`:''}${gr.map(q=>{let sel=v.answers[q.id];return `<div id="q-${q.id}" class="${p?'subquestion':''}">${!p?`<div class="tag">${kind(q.type)}</div>`:''}<div class="small muted">第 ${q.num} 題 · Week ${q.id.startsWith('word:')?'單字':q.id.slice(0,2)}</div><h3>${esc(q.q)}</h3>${!p?`<button class="btn soft" style="margin-bottom:12px" onclick="speak(${JSON.stringify(q.speech||q.q).replaceAll('"','&quot;')})">🔊 朗讀題目</button>`:''}<div class="optionGrid">${q.opts.map((o,i)=>`<button class="option ${sel===i?'selected':''} ${v.graded?(i===q.ans?'correct':sel===i?'wrong':''):''}" ${v.graded?'disabled':''} onclick="pick('${q.id}',${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${v.graded?`<div class="explanation"><strong>${sel===q.ans?'✅ 答對':'📝 答案：'+('ABCD'[q.ans])}</strong><div>${esc(q.explain||'')}</div></div>`:''}</div>`}).join('')}</div>`}
function retryWrong(){let v=view.quiz,items=v.items.filter(q=>v.answers[q.id]!==q.ans);if(!items.length){alert('本次全部答對！');return}let included=groupByPassage(v.items).filter(g=>g.some(q=>items.includes(q))).flat();startQuiz(included,'本次錯題重練（文章保留完整題組）')}
function reviewPage(){let ids=Object.keys(state.wrong),q=ids.map(id=>BYID[id]).filter(Boolean),word=ids.filter(id=>id.startsWith('word:'));let groups=groupByPassage(q);let originals=groups.map(g=>g[0]);return `<section class="section"><div class="eyebrow">REVIEW</div><h2>🔁 錯題複習</h2><p class="muted">目前有 ${ids.length} 題待複習。克漏字或閱讀若有錯題，複習時會自動帶入同篇文章的完整題組。</p><div class="buttons"><button class="btn primary" ${!q.length?'disabled':''} onclick="startReview()">開始重練選擇題</button>${word.length?`<button class="btn soft" onclick="startWrongWords()">重練錯誤單字</button>`:''}</div>${q.length?`<div class="panel"><h3>需複習的題型</h3>${['vocab','grammar','cloze','reading'].map(t=>`<p>${kind(t)}：${q.filter(x=>x.type===t).length} 題</p>`).join('')}</div>`:'<div class="empty">目前沒有需要重練的選擇題。可以先去單字島或今天的練習開始！</div>'}</section>`}
function startWrongWords(){let words=DATA.cards.filter(w=>state.wrong['word:'+w.word]);if(!words.length){alert('目前沒有單字錯題');return}startQuiz(buildWordQuiz(words),'錯誤單字重練')}
function startReview(){let base=ALL.filter(q=>state.wrong[q.id]),groups=groupByPassage(ALL);let full=groups.filter(g=>g.some(q=>base.includes(q))).flat();startQuiz(full,'錯題複習 · 共同文章完整呈現')}
function progressPage(){let a=totals(),s=state.sessions.slice(-20).reverse();return `<section class="section"><div class="eyebrow">MY PROGRESS</div><h2>📈 我的學習紀錄</h2><div class="metrics"><div class="metric"><b>${a.attempted}</b>題已練習</div><div class="metric"><b>${a.rate}%</b>題目最新正確率</div><div class="metric"><b>${a.learned}</b>字已學會</div><div class="metric"><b>${state.sessions.length}</b>次已交卷</div></div><div class="panel section"><h3>最近的交卷紀錄</h3>${s.length?s.map(x=>`<div style="display:flex;justify-content:space-between;gap:9px;border-bottom:1px solid var(--line);padding:8px 0"><span>${esc(x.title)}<div class="muted small">${new Date(x.at).toLocaleString('zh-TW')}</div></span><b>${x.correct}/${x.total}</b></div>`).join(''):'<p class="muted">尚未交卷，完成一次測驗後會出現在這裡。</p>'}</div><div class="panel"><h3>備份與管理</h3><p class="muted">所有進度保存在目前瀏覽器的 localStorage；換裝置、清除網站資料或某些離線檔案環境可能導致紀錄無法沿用。建議定期匯出。</p><div class="buttons"><button class="btn primary" onclick="exportJSON()">匯出進度 JSON</button><button class="btn soft" onclick="exportCSV()">匯出成績 CSV</button><label class="btn">匯入進度 JSON <input type="file" accept="application/json,.json" style="display:none" onchange="importJSON(this)"></label><button class="btn" onclick="clearAll()">清除本機紀錄</button></div></div></section>`}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('學測英文練習島_進度.json',JSON.stringify({app:'gsat_learning_island_v2',exported:new Date().toISOString(),data:state},null,2),'application/json')}
function exportCSV(){let rows=[['日期','測驗','答對','總題數','正確率'],...state.sessions.map(s=>[s.at,s.title,s.correct,s.total,Math.round(100*s.correct/s.total)+'%'])];download('學測英文練習島_成績.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(input){try{let o=JSON.parse(await input.files[0].text());if(o.app!=='gsat_learning_island_v2'||!o.data||!o.data.results||!o.data.sessions)throw Error('不是本網站匯出的進度格式');if(!confirm('要用匯入檔案覆蓋這個瀏覽器目前的進度嗎？'))return;state=o.data;save();draw();alert('匯入完成')}catch(e){alert('匯入失敗：'+e.message)}}
function clearAll(){if(confirm('確定清除所有作答與學習進度嗎？此動作無法復原，請先匯出備份。')){state={results:{},wrong:{},learned:{},sessions:[],settings:{}};save();draw()}}
window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});draw();
</script></body></html>
