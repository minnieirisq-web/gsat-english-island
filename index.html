teers for their ____ commitment to the project.","opts":["unwavering","accidental","temporary","conditional"],"ans":0,"explain":"unwavering commitment 堅定不移的投入。","level":5},{"id":"adv-010","num":10,"type":"vocab","q":"The medicine may ____ symptoms without addressing their underlying cause.","opts":["alleviate","intensify","constitute","derive"],"ans":0,"explain":"alleviate 緩解；underlying cause 根本原因。","level":5},{"id":"adv-011","num":11,"type":"vocab","q":"The journalist tried to ____ between verified facts and speculation.","opts":["distinguish","interfere","contribute","correspond"],"ans":0,"explain":"distinguish between A and B 區分兩者。","level":5},{"id":"adv-012","num":12,"type":"vocab","q":"Participants were asked to respond ____ rather than follow the group’s opinion.","opts":["independently","occasionally","collectively","reluctantly"],"ans":0,"explain":"independently 獨立地；而非盲從群體。","level":5},{"id":"adv-013","num":13,"type":"vocab","q":"The changes will be introduced ____ to minimize disruption.","opts":["gradually","urgently","randomly","simultaneously"],"ans":0,"explain":"gradually 逐步地；減少衝擊。","level":5},{"id":"adv-014","num":14,"type":"vocab","q":"Scientists cautioned that the evidence was too limited to draw a ____ conclusion.","opts":["definitive","temporary","casual","minor"],"ans":0,"explain":"definitive conclusion 確定性的結論。","level":5},{"id":"adv-015","num":15,"type":"vocab","q":"The city plans to ____ abandoned buildings into affordable housing.","opts":["convert","restrict","inspect","conserve"],"ans":0,"explain":"convert A into B 把 A 改造成 B。","level":5},{"id":"adv-016","num":16,"type":"vocab","q":"The report highlights a growing ____ between what people say and what they do.","opts":["discrepancy","prosperity","reputation","consensus"],"ans":0,"explain":"discrepancy 差異、不一致。","level":5},{"id":"adv-017","num":17,"type":"grammar","q":"Had the researchers collected a larger sample, their conclusions ____ more reliable.","opts":["will be","would have been","would red","discovering","having discovered"],"ans":1,"explain":"believed to have + p.p. 表示據信過去已完成的動作。","level":6},{"id":"adv-026","num":26,"type":"grammar","q":"By the time the train arrived, the passengers ____ for nearly an hour.","opts":["had been waiting","have waited","will be waiting","are waiting"],"ans":0,"explain":"過去完成進行式描述過去某時間前持續的動作。","level":6},{"id":"adv-027","num":27,"type":"grammar","q":"No sooner had the meeting begun ____ the fire alarm went off.","opts":["when","than","until","while"],"ans":1,"explain":"No sooner ... than ... 固定搭配。","level":6},{"id":"adv-028","num":28,"type":"grammar","q":"It was the lack of clear instructions ____ caused the confusion.","opts":["who","where","that","what"],"ans":2,"explain":"強調句 It was ... that ...。","level":6},{"id":"adv-c1-1","num":1,"type":"cloze","q":"Which best fits blank (1)?","opts":["reduces","predicts","ignores","measures"],"ans":0,"explain":"reduce waste 減少廢棄物。","passage":"An increasing number of cities are encouraging residents to repair household items instead of discarding them. A repair café, for instance, provides tools and volunteers who help visitors fix broken objects. This approach not only (1) ____ the amount of waste but also creates opportunities for neighbors to share practical skills. Nevertheless, such programs cannot succeed (2) ____ local residents are willing to participate. Organizers therefore need to make the events accessible and explain how small actions can (3) ____ a wider environmental goal. In the long run, the success of repair cafés may depend less on technology than on the sense of community they (4) ____.","topic":"進階克漏字：篇章語意與搭配","level":6},{"id":"adv-c1-2","num":2,"type":"cloze","q":"Which best fits blank (2)?","opts":["unless","although","because","once"],"ans":0,"explain":"unless 除非；若居民不願參與就無法成功。","passage":"An increasing number of cities are encouraging residents to repair household items instead of discarding them. A repair café, for instance, provides tools and volunteers y misleading headlines.","topic":"進階克漏字：篇章語意與搭配","level":6},{"id":"adv-c2-3","num":3,"type":"cloze","q":"Which best fits blank (3)?","opts":["skepticism","obedience","urgency","certainty"],"ans":0,"explain":"healthy skepticism 健康的懷疑態度。","passage":"When we encounter a surprising statistic online, we may be tempted to share it immediately. Yet numbers rarely explain themselves. A percentage can sound impressive while hiding the fact that the original sample was very small. Before accepting a claim, readers should consider (1) ____ collected the information and how participants were selected. They should also ask whether the figure has been (2) ____ by an independent source. This habit does not mean rejecting every unfamiliar claim; rather, it encourages a healthy degree of (3) ____. By pausing to examine the evidence, readers are less likely to be (4) ____ by misleading headlines.","topic":"進階克漏字：篇章語意與搭配","level":6},{"id":"adv-c2-4","num":4,"type":"cloze","q":"Which best fits blank (4)?","opts":["misled","protected","encouraged","supported"],"ans":0,"explain":"be misled by 被……誤導。","passage":"When we encounter a surprising statistic online, we may be tempted to share it immediately. Yet numbers rarely explain themselves. A percentage can sound impressive while hiding the fact that the original sample was very small. Before accepting a claim, readers should consider (1) ____ collected the information and how participants were selected. They should also ask whether the figure has been (2) ____ by an independent source. This habit does not mean rejecting every unfamiliar claim; rather, it encourages a healthy degree of (3) ____. By pausing to examine the evidence, readers are less likely to be (4) ____ by misleading headlines.","topic":"進階克漏字：篇章語意與搭配","level":6},{"id":"adv-r1-1","num":1,"type":"reading","q":"What concern did the library initially have?","opts":["The expense of advertising the program.","The maintenance of borrowed tools.","A shortage of library books.","A lack of public interest in sewing."],"ans":1,"explain":"原文提到 staff worried ... difficult to maintain。","passage":"A city library introduced a “borrow a tool” program after noticing that residents often purchased equipment they used only once. Members can now borrow drills, ladders, and sewing machines for a few days, just as they borrow books. At first, some staff worried that the equipment would be difficult to maintain. The library responded by offering brief safety demonstrations and requiring borrowers to report damage. Within a year, the program attracted people who had rarely visited the library before. The director believes its greatest value lies not in the money saved but in changing how people think about shared public resources.","topic":"進階閱讀：推論與主旨","level":6},{"id":"adv-r1-2","num":2,"type":"reading","q":"What is the director’s main point?","opts":["The program should replace book lending.","Residents should purchase fewer books.","The program encourages a new view of shared resources.","Only experienced workers should borrow tools."],"ans":2,"explain":"最後一句指出 greatest value 在於改變人們對共享公共資源的看法。","passage":"A city library introduced a “borrow a tool” program after noticing that residents often purchased equipment they used only once. Members can now borrow drills, ladders, and sewing machines for a few days, just as they borrow books. At first, some staff worried that the equipment would be difficult to maintain. The library responded by offering brief safety demonstrations and requiring borrowers to report damage. Within a year, the program attracted people who had rarely visited the library before. The director believes its greatest value lies not in the money saved but in changing how people think about shared public resources.","topic":"進階閱讀：推論與主旨","level":6},{"id":"adv-r2-1","num":1,"type":"reading","q":"Why were some students dissatisfied with group projects?","opts":["They did not understand the topics.","Their results seemed overly dependent on classmates.","They had too many individual tests.","Teachers refused to provide instructions."],"ans":1,"explain":"成績過度受到組員表現影響。","passage":"After a school replaced some of its traditional exams with group projects, teachers noticed an unexpected problem. Although students became more enthusiastic during lessons, some felt that their grades depended too much on their teammates. The school responded by combining group scores with short individual reflections and peer evaluations. This change did not eliminate every disagreement, but it gave teachers more information about each student’s contribution. The experience suggests that changing an assessment method involves more than introducing a new activity; schools must also reconsider what counts as fair evidence of learning.","topic":"進階閱讀：推論與主旨","level":6},{"id":"adv-r2-2","num":2,"type":"reading","q":"Which statement best expresses the passage’s conclusion?","opts":["Students should never work in groups.","Peer evaluations always solve assessment problems.","Fair assessment requires careful design of evidence.","Traditional exams measure every skill accurately."],"ans":2,"explain":"結尾指出改革評量方式也必須重新考量公平的學習證據。","passage":"After a school replaced some of its traditional exams with group projects, teachers noticed an unexpected problem. Although students became more enthusiastic during lessons, some felt that their grades depended too much on their teammates. The school responded by combining group scores with short individual reflections and peer evaluations. This change did not eliminate every disagreement, but it gave teachers more information about each student’s contribution. The experience suggests that changing an assessment method involves more than introducing a new activity; schools must also reconsider what counts as fair evidence of learning.","topic":"進階閱讀：推論與主旨","level":6},{"id":"listen-01","num":1,"type":"listening","q":"When will the group meet?","opts":["Thursday morning","Thursday afternoon","Friday morning","Friday afternoon"],"ans":3,"explain":"男生改訂 Friday afternoon，女生表示同意。","speech":"Woman: Did you reserve the study room for Thursday? Man: I tried, but it was fully booked. I got Friday afternoon instead. Woman: That's fine. I'll tell the others about the change.","level":5},{"id":"listen-02","num":2,"type":"listening","q":"Why can the speakers visit later than usual?","opts":["Admission is free.","A special event extends opening hours.","They have advance tickets.","The museum moved to a new location."],"ans":1,"explain":"特殊活動使博物館今天延長開放到晚上八點。","speech":"Man: The museum closes at five, right? Woman: Usually, but today there's a special event, so it stays open until eight. Man: Great. Then we can go after dinner.","level":5},{"id":"listen-03","num":3,"type":"listening","q":"What caused the man's problem?","opts":["He forgot the assignment.","The library was closed.","His computer needed repair.","He misunderstood the deadline."],"ans":2,"explain":"男生花很多時間修電腦，因此作業幾乎還沒開始。","speech":"Woman: You look tired. Were you studying all night? Man: Not exactly. I spent hours trying to fix my computer, so I barely started the assignment. Woman: The library has computers you can use.","level":5},{"id":"listen-04","num":4,"type":"listening","q":"What must the man do to attend?","opts":["Pay a membership fee.","Bring a student ID tomorrow.","Register online in advance.","Prepare a short presentation."],"ans":2,"explain":"免費但須先線上報名，因為座位有限。","speech":"Man: I thought the workshop was free. Woman: It is for students, but you need to register online first. The number of seats is limited. Man: I'll sign up right away.","level":5},{"id":"listen-05","num":5,"type":"listening","q":"What will the speakers most likely do next?","opts":["Remove all statistics from their report.","Search for the original research.","Publish the article online.","Interview the article's author."],"ans":1,"explain":"兩人認為需要先找到原始研究。","speech":"Woman: The article makes a strong claim, but I couldn't find where the data came from. Man: I noticed that too. Maybe we should look for the original study before using it in our report.","level":5},{"id":"listen-06","num":6,"type":"listening","q":"Why does the woman choose the regular train?","opts":["It is cheaper and the time difference is small.","The express train is canceled.","She missed her reserved seat.","The regular train has better food."],"ans":0,"explain":"她認為加價只省約十分鐘，不值得。","speech":"Man: Are you taking the express train? Woman: No, it costs more and only saves about ten minutes. Since I'm not in a hurry, I'll take the regular one.","level":5},{"id":"listen-07","num":7,"type":"listening","q":"What did the woman decide to do?","opts":["Return a jacket to the store.","Purchase a different jacket.","Repair her existing jacket.","Give away an unused jacket."],"ans":2,"explain":"她改成修理拉鍊而不是買新外套。","speech":"Woman: I was going to buy a new jacket, but I decided to repair the zipper instead. Man: Good idea. The repair shop near campus charges very little.","level":5},{"id":"listen-08","num":8,"type":"listening","q":"What is the status of their project?","opts":["It has been rejected.","It won an award.","It needs additional information.","It is already on display."],"ans":2,"explain":"主辦方要求補充研究方法才能作最後決定。","speech":"Man: Did the science fair accept our project? Woman: Not yet. They asked us to explain the method in greater detail before making a final decision.","level":5},{"id":"listen-09","num":9,"type":"listening","q":"What surprised the speakers?","opts":["The documentary was canceled.","Its topic differed from their expectations.","It contained no interviews.","The screening room was crowded."],"ans":1,"explain":"紀錄片實際探討城市節能，與兩人的預期不同。","speech":"Woman: I expected the documentary to focus on endangered animals. Man: Me too, but it mostly examined how cities can reduce their energy use. Woman: Still, I learned a lot.","level":5},{"id":"listen-10","num":10,"type":"listening","q":"When can the woman review the application?","opts":["Before tonight's meeting.","During the meeting.","Early tomorrow morning.","Next weekend."],"ans":2,"explain":"女生晚上九點前有會議，明早才有空。","speech":"Man: Can you review my application tonight? Woman: I have a meeting until nine. If you send it now, I can look at it early tomorrow morning.","level":5},{"id":"listen-11","num":11,"type":"listening","q":"What does the man offer?","opts":["To prepare the slides himself.","To provide practice and feedback.","To ask for a later deadline.","To present in her place."],"ans":1,"explain":"男生願意陪練並指出不清楚之處。","speech":"Woman: I'm worried about giving the presentation. Man: You know the material well. Why not practice with me first? I can point out anything that's unclear.","level":6},{"id":"listen-12","num":12,"type":"listening","q":"Why might the group not receive a discount?","opts":["They arrived too late.","They have fewer than six people.","They ordered the wrong dishes.","They did not book online."],"ans":1,"explain":"折扣門檻是六人，但他們只有五人。","speech":"Man: The restaurant has a discount for groups of six or more. Woman: There are only five of us. Man: Then let's compare the regular menu before we decide.","level":6},{"id":"listen-13","num":13,"type":"listening","q":"What is the man's suggestion?","opts":["Cancel the project.","Take photos immediately.","Change the location permanently.","Do writing work first and take photos later."],"ans":3,"explain":"先寫圖說，下午再拍照。","speech":"Woman: The weather report says the rain should stop by noon. Man: In that case, let's postpone the outdoor photos until the afternoon and work on the captions now.","level":6},{"id":"listen-14","num":14,"type":"listening","q":"How has the woman's research changed?","opts":["It now focuses on a narrower subject.","It covers more cities.","It no longer studies transportation.","It has shifted to public health."],"ans":0,"explain":"研究範圍縮小為單一城市的共享單車。","speech":"Man: I heard you changed your research topic. Woman: Just narrowed it. Instead of studying all forms of transportation, I'm focusing on bicycle-sharing systems in one city.","level":6},{"id":"listen-15","num":15,"type":"listening","q":"What does the man suggest?","opts":["Buying another copy immediately.","Contacting the author.","Checking delivery updates.","Going to the library instead."],"ans":2,"explain":"建議查詢物流及通知。","speech":"Woman: I ordered the book two weeks ago, but it hasn't arrived. Man: Have you checked the tracking information? Sometimes the delivery notice goes to the spam folder.","level":6},{"id":"listen-16","num":16,"type":"listening","q":"What is the man's main concern?","opts":["The app is too expensive.","Its claim lacks convincing evidence.","It is difficult to install.","It collects no user feedback."],"ans":1,"explain":"使用者心得不足以支持效果宣稱。","speech":"Man: The new app claims it improves concentration. Woman: Does it cite any research? Man: Only testimonials from users. I think we need stronger evidence.","level":6},{"id":"listen-17","num":17,"type":"listening","q":"Which purchase does the man prioritize?","opts":["New chairs","A larger table","Better lighting","More textbooks"],"ans":2,"explain":"暗室閱讀不便，所以優先改善照明。","speech":"Woman: We have enough money for either new chairs or better lighting, but not both. Man: Since most students complain about reading in the dim room, lighting should come first.","level":6},{"id":"listen-18","num":18,"type":"listening","q":"Why was the schedule changed?","opts":["The teacher is on vacation.","The room cannot be used on Wednesdays.","The class has too many students.","Tuesday is a holiday."],"ans":1,"explain":"週三教室無法使用，因此改到週二。","speech":"Man: I thought the class was on Wednesday. Woman: It used to be, but the instructor moved it to Tuesday because the room is unavailable on Wednesdays.","level":6},{"id":"listen-19","num":19,"type":"listening","q":"What does the man recommend?","opts":["Ignoring the population difference.","Comparing percentages rather than totals.","Counting only weekend cyclists.","Removing one neighborhood from the report."],"ans":1,"explain":"人口不同應比較比例，不只比較總人數。","speech":"Woman: The article compares two neighborhoods, but one has twice as many residents. Man: Then the total number of cyclists alone isn't a fair comparison. We should look at the percentage instead.","level":6},{"id":"listen-20","num":20,"type":"listening","q":"How does the woman describe the interview?","opts":["It was canceled unexpectedly.","It went fairly well despite a difficult question.","She refused to answer any questions.","It was much worse than expected."],"ans":1,"explain":"整體比預期好，但有一題讓她措手不及。","speech":"Man: Did the interview go well? Woman: Better than expected, although one question caught me off guard. I took a moment to think before answering.","level":6}];
const ALL=[...DATA.weeks.flatMap(w=>w.questions),...EXTRA];
const BYID=Object.fromEntries(ALL.map(q=>[q.id,q]));
const STORE='gsat_learning_island_v2';
let spellGame=null;
let state=load(),tab='home',view={level:4,mode:'vocab',index:0,quiz:null,filter:'all',difficulty:'advanced'};
function load(){try{let o=JSON.parse(localStorage.getItem(STORE)||'{}');return {results:o.results||{},wrong:o.wrong||{},learned:o.learned||{},sessions:o.sessions||[],settings:o.settings||{},spelling:o.spelling||{}}}catch(e){return {results:{},wrong:{},learned:{},sessions:[],settings:{},spelling:{}}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){alert('瀏覽器無法保存進度，請使用「匯出紀錄」備份。')}}
function el(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// 將所有試題空格標記移除再交給語音合成，避免把底線讀成 underscore / score。
// 一律保留未填答文章；沒有任何答案資料會送進朗讀功能。
let clozeReadToken=0;
function cleanSpeechText(raw){
  return String(raw||'')
    .replace(/[（(]\s*\d+\s*[)）]\s*[_＿﹍‗]{2,}/g, ', ')
    .replace(/\[\s*\d+\s*\]\s*[_＿﹍‗]{2,}/g, ', ')
    .replace(/[_＿﹍‗]{2,}/g, ', ')
    .replace(/[（(]\s*\d+\s*[)）]\s*(?=[,.;!?])/g, '')
    .replace(/\s+,/g, ',')
    .replace(/,{2,}/g, ',')
    .replace(/\s+/g, ' ').trim();
}
function speak(s){
  clozeReadToken++;
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援朗讀');return}
  speechSynthesis.cancel();
  const text=cleanSpeechText(s);
  if(!text)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.85;
  speechSynthesis.speak(u);
}
function speakCloze(passage){
  clozeReadToken++;
  if(!('speechSynthesis' in window)){alert('這個瀏覽器不支援朗讀');return}
  speechSynthesis.cancel();
  // 單次朗讀：以逗號標示自然停頓；底線與題號完全不傳給語音引擎。
  const text=cleanSpeechText(passage);
  if(!text)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.85;
  speechSynthesis.speak(u);
}
function kind(t){return {vocab:'單字題',grammar:'文法題',cloze:'克漏字',reading:'閱讀理解',listening:'聽力測驗'}[t]||t}
function switchTab(t){clozeReadToken++;if('speechSynthesis' in window)speechSynthesis.cancel();tab=t;view.quiz=null;draw();window.scrollTo({top:0,behavior:'instant'})}
function navbar(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function draw(){navbar();let content=({home:homePage,vocab:vocabPage,grammar:()=>typePage('grammar'),cloze:()=>typePage('cloze'),reading:()=>typePage('reading'),spelling:spellingPage,listening:listeningPage,review:reviewPage,progress:progressPage})[tab]();el('app').innerHTML=content}
function totals(){let attempted=Object.keys(state.results).length,correct=Object.values(state.results).filter(v=>v.correct).length;return {attempted,correct,rate:attempted?Math.round(100*correct/attempted):0,learned:Object.values(state.learned).filter(Boolean).length}}
function homePage(){let a=totals();return `<section class="hero"><div><div class="eyebrow">FREE · NO SIGN-UP · 自主學習</div><h1>你的學測英文<br>一座一座慢慢練 🌿</h1><p class="muted">六級單字字卡、文法、完整克漏字題組、閱讀理解與聽力練習，搭配英文朗讀、中文簡析與錯題重練。沒有付費牆，不必建立帳號。</p><div class="buttons"><button class="btn primary" onclick="switchTab('vocab')">開始六級單字</button><label class="small">每日難度 <select aria-label="每日練習難度" onchange="setDifficulty(this.value)"><option value="advanced" ${view.difficulty==='advanced'?'selected':''}>進階（推薦）</option><option value="basic" ${view.difficulty==='basic'?'selected':''}>基礎</option></select></label><button class="btn soft" onclick="startDaily()">今日 10 題</button><button class="btn" onclick="openWeeks()">25 週題庫</button></div></div><div class="art">📚 ☁️<span>每天一點點，就會一點點</span></div></section><section class="section"><div class="metrics"><div class="metric"><b>${a.attempted}</b>題已練習</div><div class="metric"><b>${a.rate}%</b>歷次題目最新答對率</div><div class="metric"><b>${a.learned}</b>個字已標記學會</div><div class="metric"><b>${Object.keys(state.wrong).length}</b>題待複習</div></div></section><section class="section"><h2>選擇今天的學習島</h2><div class="grid">${[['vocab','🌱','六級單字','高中學測語境選字、朗讀、拼字及分級測驗'],['spelling','⌨️','拼字小遊戲','聽發音、看中文提示，自己拼出單字'],['grammar','📝','文法島','100 題句型文法練習'],['cloze','🧩','克漏字島','25 篇文章，四題完整呈現'],['reading','📖','閱讀島','25 篇短文，共 50 題'],['listening','🎧','聽力島','先聽英文對話，再回答理解問題（20 題）'],['review','🔁','錯題複習','只練還需要加強的題目'],['progress','📈','學習紀錄','檢視紀錄、備份與匯出']].map(x=>`<div class="panel"><div style="font-size:30px">${x[1]}</div><h3>${x[2]}</h3><p class="muted">${x[3]}</p><button class="btn soft" onclick="switchTab('${x[0]}')">進入學習</button></div>`).join('')}</div></section><p class="help">📌 題庫目前包含原始 500 題、進階與聽力新增 60 題，共 560 題，另有 ${DATA.cards.length} 張單字卡，新增中高階語境選字測驗。「L1～L6」為本站教學建議分級，尚非大考中心詞彙分級認證，也不代表已收錄六千單字。</p>`}
function vocabPage(){let cards=DATA.cards.filter(w=>w.level===view.level),done=cards.filter(w=>state.learned[w.word]).length;return `<section class="section"><div class="eyebrow">VOCABULARY ISLAND</div><h2>🌱 六級單字島</h2><p class="muted">高中學測建議先選 Level 3～5，以句子語境選字、朗讀及拼字練習。Level 6 提供延伸挑戰；本網站級別為教學建議，並非官方逐字核對。</p><div class="controls"><label for="level">選擇難度</label><select id="level" onchange="view.level=+this.value;draw()">${Array.from({length:6},(_,i)=>`<option value="${i+1}" ${view.level===i+1?'selected':''}>Level ${i+1}</option>`).join('')}</select><span class="tag">本級 ${cards.length} 字</span><span class="muted small">已學會 ${done}/${cards.length}</span><button class="btn soft" onclick="switchTab('spelling')">⌨️ 練拼字</button><button class="btn primary" onclick="startVocab()">測驗本級單字</button></div><div class="cardGrid">${cards.map(w=>`<div class="wordCard"><span class="tag">L${w.level}</span>${state.spelling[w.word]?`<span class="wordStatus">✏️ 拼字練過 ${state.spelling[w.word].tries} 次</span>`:''}<h3>${esc(w.word)}</h3><div><b>${esc(w.zh)}</b></div><div class="example">${esc(w.example)}</div><div class="buttons"><button class="btn soft" onclick="speak(${JSON.stringify(w.word).replaceAll('"','&quot;')})">🔊 單字</button><button class="btn" onclick="speak(${JSON.stringify(w.example).replaceAll('"','&quot;')})">🔊 例句</button><button class="btn ${state.learned[w.word]?'green':''}" onclick="toggleWord('${w.word}')">${state.learned[w.word]?'✓ 已學會':'○ 標記學會'}</button></div></div>`).join('')}</div></section>`}
function toggleWord(w){state.learned[w]=!state.learned[w];save();draw()}
function hashShuffle(a){let out=a.slice();for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function startVocab(){let list=DATA.cards.filter(w=>w.level===view.level);let items=buildWordQuiz(list);startQuiz(items,`Level ${view.level} 單字測驗`)}
function buildWordQuiz(list){
 const bank=DATA.cards;
 return hashShuffle(list).slice(0,Math.min(10,list.length)).map((w,i)=>{
   const source=(w.example||'').trim();
   const escaped=w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   const pattern=new RegExp('\\b'+escaped+'\\b','i');
   const hasContext=pattern.test(source);
   const nearby=bank.filter(x=>x.word!==w.word&&x.level===w.level&&x.zh!==w.zh);
   let distract=hashShuffle(nearby).slice(0,3);
   if(distract.length<3)distract=distract.concat(hashShuffle(bank.filter(x=>x.word!==w.word&&!distract.includes(x))).slice(0,3-distract.length));
   const options=hashShuffle([w,...distract]);
   return {id:'word:'+w.word,num:i+1,type:'word',q:hasContext?source.replace(pattern,'____')+'\nChoose the most suitable word.':`${w.zh} 的英文是哪一個？`,opts:options.map(x=>x.word),ans:options.findIndex(x=>x.word===w.word),explain:`${w.word}：${w.zh}。例句：${source}`,speech:null};
 });
}
function spellingPool(){return DATA.cards.filter(w=>w.level===view.level)}
function spellingStart(){
 const pool=spellingPool();spellGame={words:hashShuffle(pool).slice(0,Math.min(10,pool.length)),at:0,checked:false,correct:0,answered:0};draw();
}
function spellingPage(){
 const levels=Array.from({length:6},(_,i)=>`<option value="${i+1}" ${view.level===i+1?'selected':''}>Level ${i+1}</option>`).join('');
 if(!spellGame)return `<section class="section"><div class="eyebrow">SPELLING GAME</div><h2>⌨️ 拼字小遊戲</h2><p class="muted">看中文提示、聽英文發音，再用鍵盤拼出單字。每輪最多 10 題；送出前不顯示答案。拼字紀錄保存在本機。</p><div class="panel spellCard"><label>選擇單字級別 <select onchange="view.level=+this.value;draw()">${levels}</select></label><p class="muted">本級 ${spellingPool().length} 字。支援手機鍵盤，也可以重播發音。</p><button class="btn primary" onclick="spellingStart()">開始拼字 10 題</button></div></section>`;
 const g=spellGame;
 if(g.at>=g.words.length)return `<section class="section"><div class="panel spellCard"><h2>🎉 拼字完成</h2><p class="spellPrompt">${g.correct} / ${g.words.length} 題答對</p><p class="muted">進度已保存在這台裝置的瀏覽器。</p><div class="buttons"><button class="btn primary" onclick="spellingStart()">再玩一次</button><button class="btn" onclick="spellGame=null;draw()">選其他級別</button></div></div></section>`;
 const w=g.words[g.at],rec=state.spelling[w.word],latest=rec?.lastCorrect;
 return `<section class="section"><div class="eyebrow">SPELLING GAME · LEVEL ${view.level}</div><div class="panel spellCard"><div class="small muted">第 ${g.at+1} / ${g.words.length} 題　｜　本輪答對 ${g.correct} 題</div><div class="progressTrack"><div class="progressBar" style="width:${100*g.at/g.words.length}%"></div></div><div class="spellPrompt">${esc(w.zh)}</div><button class="btn soft" onclick="speakSpell()">🔊 聽單字發音</button><p class="muted small">${esc('請依中文意思及發音輸入英文；不需輸入標點。')}</p><form onsubmit="spellingCheck();return false"><input id="spellInput" class="spellInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡輸入英文拼字" ${g.checked?'disabled':''} aria-label="輸入英文拼字"><div class="spellControls">${g.checked?`<button class="btn primary" type="button" onclick="spellingNext()">${g.at+1===g.words.length?'查看成績':'下一題 →'}</button>`:`<button class="btn primary" type="submit">檢查拼字</button>`}<button class="btn" type="button" onclick="speakSpell()">重播發音</button></div></form>${g.checked?`<div class="spellFeedback"><strong>${g.lastOK?'✅ 拼對了！':'📝 再記住這個拼法：'} ${esc(w.word)}</strong><div>${esc(w.example)}</div><div class="muted small">這個單字曾練習 ${rec?.tries||1} 次</div></div>`:''}</div></section>`;
}
function speakSpell(){if(spellGame&&spellGame.at<spellGame.words.length)speak(spellGame.words[spellGame.at].word)}
function spellingCheck(){
 const g=spellGame;if(!g||g.checked||g.at>=g.words.length)return;
 const val=el('spellInput')?.value?.trim().toLowerCase().replace(/\s+/g,' ');if(!val){alert('請先輸入英文拼字。');return}
 const w=g.words[g.at],ok=val===w.word.trim().toLowerCase();g.checked=true;g.lastOK=ok;g.correct+=ok?1:0;g.answered++;
 const r=state.spelling[w.word]||{tries:0,correct:0};r.tries++;r.correct+=ok?1:0;r.lastCorrect=ok;r.last=Date.now();state.spelling[w.word]=r;
 save();draw();
}
function spellingNext(){if(!spellGame||!spellGame.checked)return;spellGame.at++;spellGame.checked=false;draw()}
function typePage(t){let list=DATA.weeks.flatMap(w=>w.questions).filter(q=>q.type===t),name=kind(t),qty=t==='cloze'?'25 篇文章（共 100 題）':t==='reading'?'25 篇文章（共 50 題）':'100 題';return `<section class="section"><div class="eyebrow">PRACTICE ISLAND</div><h2>${{grammar:'📝',cloze:'🧩',reading:'📖'}[t]} ${name}島</h2><p class="muted">題庫：${qty}。可以依週次練習，也可以抽題；每份克漏字都會一次出現文章與四題。</p><button class="btn primary" onclick="startQuiz(EXTRA.filter(q=>q.type==='${t}'),'進階${kind(t)}練習')">🌟 進階挑戰</button><div class="buttons"><button class="btn primary" onclick="startType('${t}','random')">${t==='cloze'?'抽 1 篇文章':t==='reading'?'抽 1 篇短文':'抽 10 題練習'}</button><button class="btn soft" onclick="startType('${t}','all')">${t==='cloze'?'全部 25 篇':t==='reading'?'全部 25 篇':'全部 100 題'}</button></div><h3>依週次練習</h3><div class="weekGrid">${DATA.weeks.map(w=>`<button class="week" onclick="startType('${t}',${w.week})">Week ${String(w.week).padStart(2,'0')}<div class="small muted">${t==='grammar'?'4 題':t==='cloze'?'4 題': '2 題'}</div><span class="statusLabel">${weekStatus(w,t)}</span></button>`).join('')}</div></section>`}
function groupByPassage(list){let groups=[],seen=new Set();for(let q of list){if(q.passage){let k=q.type+'|'+q.passage;if(seen.has(k))continue;seen.add(k);groups.push(list.filter(x=>x.type===q.type&&x.passage===q.passage))}else groups.push([q])}return groups}
function startType(t,mode){let items=DATA.weeks.flatMap(w=>w.questions).filter(q=>q.type===t&&(typeof mode!=='number'||Number(q.id.slice(0,2))===mode));if(mode==='random'){let groups=groupByPassage(items);let g=groups[Math.floor(Math.random()*groups.length)];items=t==='grammar'?hashShuffle(items).slice(0,10):g}else if(mode==='all'){items=items}startQuiz(items,`${kind(t)} · ${typeof mode==='number'?'Week '+String(mode).padStart(2,'0'):mode==='random'?'隨機練習':'完整題庫'}`)}
function sampleN(items,n){return hashShuffle(items).slice(0,n)}
function startDaily(){
 // 每日題數固定為 10；完整克漏字文章佔 4 題，絕不拆散。
 const hard=view.difficulty==='advanced';
 const pool=hard?EXTRA:ALL.filter(q=>!q.id.startsWith('adv-')&&!q.id.startsWith('listen-'));
 const voc=sampleN(pool.filter(q=>q.type==='vocab'),2);
 const gram=sampleN(pool.filter(q=>q.type==='grammar'),1);
 const clozeGroups=groupByPassage(pool.filter(q=>q.type==='cloze')).filter(g=>g.length===4);
 const cloze=sampleN(clozeGroups,1)[0]||[];
 const read=sampleN(pool.filter(q=>q.type==='reading'),1);
 const hear=sampleN(EXTRA.filter(q=>q.type==='listening'),2);
 const items=[...voc,...gram,...cloze,...read,...hear];
 if(items.length!==10 || new Set(items.map(q=>q.id)).size!==10){
  alert('題庫抽取檢查未通過，請重新開始。');return;
 }
 startQuiz(items,'今日 10 題 · '+(hard?'進階模式':'基礎模式')+' · 含聽力');
}
function setDifficulty(v){view.difficulty=v;draw()}
function listeningPage(){return `<section class="section"><div class="eyebrow">LISTENING PRACTICE</div><h2>🎧 英語聽力島</h2><p class="muted">共 ${EXTRA.filter(q=>q.type==='listening').length} 題原創英語對話理解。作答前不顯示逐字稿；請聽完再選答案。交卷後可查看逐字稿與中文解析。</p><div class="buttons"><button class="btn primary" onclick="startQuiz(sampleN(EXTRA.filter(q=>q.type==='listening'),10),'聽力挑戰 · 10 題')">開始聽力 10 題</button><button class="btn" onclick="startQuiz(EXTRA.filter(q=>q.type==='listening'),'聽力完整題庫 · 20 題')">完整聽力 20 題</button></div><p class="help">🔊 請先按播放。手機需開啟音量，部分瀏覽器需要點擊後才能啟動語音。</p></section>`}
function advancedPage(t){const all=EXTRA.filter(q=>q.type===t);const groups=groupByPassage(all);return `<section class="section"><h2>🌟 進階${kind(t)}挑戰</h2><p class="muted">題目較著重語境、推論與高中高階文法；並非官方學測題庫。</p><div class="buttons"><button class="btn primary" onclick="startQuiz(EXTRA.filter(q=>q.type==='${t}'),'進階${kind(t)}練習')">開始練習（${all.length} 題）</button></div></section>`}
function questionStatus(ids){
 const count=ids.filter(id=>state.results[id]&&state.results[id].chosen!==null&&state.results[id].chosen!==undefined).length;
 return count===ids.length?'✓ 已完成':count?`已做過 ${count}/${ids.length}`:'○ 未練習';
}
function weekStatus(w,t){const items=w.questions.filter(q=>!t||q.type===t);return questionStatus(items.map(q=>q.id))}
function openWeeks(){tab='home';draw();el('app').insertAdjacentHTML('beforeend',`<section class="section"><h2>📅 25 週完整題庫</h2><p class="muted">每週 20 題，包含詞彙 10、文法 4、克漏字 4、閱讀 2。共用文章一次顯示完整題組。</p><div class="weekGrid">${DATA.weeks.map(w=>`<button class="week" onclick="startQuiz(DATA.weeks[${w.week-1}].questions,'Week ${String(w.week).padStart(2,'0')} · 20 題')">Week ${String(w.week).padStart(2,'0')}<span class="statusLabel">${weekStatus(w)}</span></button>`).join('')}</div></section>`);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function startQuiz(qs,title){if(title.startsWith('今日 10 題')&&qs.length!==10){alert('每日練習題數異常：'+qs.length+' 題');return}view.quiz={items:qs,answers:{},graded:false,title};el('app').innerHTML=quizPage();window.scrollTo({top:0,behavior:'instant'})}
function pick(id,index){let v=view.quiz;if(!v||v.graded)return;v.answers[id]=index;let node=el('q-'+id);if(node){node.querySelectorAll('.option').forEach((b,i)=>b.classList.toggle('selected',i===index))}let count=Object.keys(v.answers).length;el('quizStatus').textContent=`已作答 ${count} / ${v.items.length} 題`;el('quizBar').style.width=(100*count/v.items.length)+'%'}
function grade(){let v=view.quiz;if(!v||v.graded)return;let missing=v.items.length-Object.keys(v.answers).length;if(missing&&!confirm(`還有 ${missing} 題未作答，要直接批改嗎？`))return;v.graded=true;let good=0;for(let q of v.items){let chosen=v.answers[q.id],ok=chosen===q.ans;if(ok)good++;if(chosen!==undefined){state.results[q.id]={correct:ok,last:Date.now(),chosen};if(ok)delete state.wrong[q.id];else state.wrong[q.id]=true}}state.sessions.push({at:new Date().toISOString(),title:v.title,total:v.items.length,correct:good});if(state.sessions.length>500)state.sessions=state.sessions.slice(-500);save();el('app').innerHTML=quizPage();window.scrollTo({top:0,behavior:'smooth'})}
function quizPage(){let v=view.quiz;if(!v)return '';let done=Object.keys(v.answers).length,good=v.graded?v.items.filter(q=>v.answers[q.id]===q.ans).length:0;let groups=groupByPassage(v.items);return `<section class="section quiz"><div class="eyebrow">PRACTICE · ${esc(v.title)}</div><div class="quizHead"><h2>${esc(v.title)}</h2><button class="btn" onclick="view.quiz=null;draw()">返回學習島</button></div><div id="quizStatus" class="muted">${v.graded?`答對 ${good}/${v.items.length} 題 · ${Math.round(100*good/v.items.length)} 分`:`已作答 ${done} / ${v.items.length} 題`}</div><div class="progressTrack"><div id="quizBar" class="progressBar" style="width:${100*done/v.items.length}%"></div></div>${groups.map(gr=>groupHTML(gr,v)).join('')}<div class="panel"><div class="buttons">${v.graded?`<button class="btn primary" onclick="retryWrong()">重練本次錯題</button><button class="btn" onclick="view.quiz=null;draw()">完成返回</button>`:`<button class="btn primary" onclick="grade()">交卷並查看解析</button><button class="btn" onclick="view.quiz=null;draw()">暫時離開</button>`}</div><p class="small muted">${v.graded?'已將作答結果保存至本機紀錄。':'完成後會顯示正確答案與中文簡析。未交卷前不記錄本次成績。'}</p></div></section>`}
function groupHTML(gr,v){
 const p=gr[0].passage;
 const shared=Boolean(p),cloze=shared&&gr[0].type==='cloze';
 const source=shared?`<div class="readingSource"><div class="tag">${kind(gr[0].type)} · 共同文章 · ${gr.length} 題</div><div class="muted small">${esc(gr[0].topic||'')}</div><details class="passageDetails" open><summary>📖 文章（點此展開／收合）</summary><div class="passage">${esc(p)}</div></details><button class="btn soft readBtn" onclick="${cloze?'speakCloze':'speak'}(${JSON.stringify(p).replaceAll('"','&quot;')})">🔊 朗讀文章${cloze?'（空格停頓）':''}</button></div>`:'';
 const qs=gr.map((q,gi)=>{
 const sel=v.answers[q.id],isListening=q.type==='listening';
 return `<div id="q-${q.id}" class="${shared?'subquestion':'singleQuestion'} ${cloze&&gi===0?'activeCloze':''}">${!shared?`<div class="tag">${kind(q.type)}</div>`:''}<div class="small muted">${q.id.startsWith('listen-')?'聽力題':q.id.startsWith('adv-')?'進階題':'第 '+q.num+' 題 · Week '+q.id.slice(0,2)}</div>${isListening?`<button class="btn soft listenButton" onclick="speak(${JSON.stringify(q.speech).replaceAll('"','&quot;')})">▶ 播放英文對話</button><p class="small muted">交卷前不會顯示聽力逐字稿。</p>`:''}<h3>${esc(q.q)}</h3>${!shared&&!isListening&&q.type!=='word'?`<button class="btn soft" style="margin-bottom:12px" onclick="speak(${JSON.stringify(q.speech||q.q).replaceAll('"','&quot;')})">🔊 朗讀題目</button>`:''}<div class="optionGrid">${q.opts.map((o,i)=>`<button class="option ${sel===i?'selected':''} ${v.graded?(i===q.ans?'correct':sel===i?'wrong':''):''}" ${v.graded?'disabled':''} onclick="pick('${q.id}',${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${v.graded?`<div class="explanation"><strong>${sel===q.ans?'✅ 答對':'📝 答案：'+('ABCD'[q.ans])}</strong><div>${esc(q.explain||'')}</div>${isListening?`<details><summary>查看英文逐字稿</summary><p>${esc(q.speech)}</p></details>`:''}</div>`:''}</div>`}).join('');
 const gid=gr[0].id;
 const nav=cloze?`<div class="clozeStepNav" data-group="${gid}"><button class="btn" onclick="clozeStep('${gid}',-1)">← 上一題</button><span class="clozeStepCount" id="count-${gid}">第 1 / ${gr.length} 題</span><button class="btn primary" onclick="clozeStep('${gid}',1)">下一題 →</button></div>`:'';
 return `<div class="question ${shared?'sharedQuestion':''} ${cloze?'clozeQuestion':''}" id="group-${gid}">${shared?`<div class="sharedLayout">${source}<div class="sharedOptions"><div class="small muted">${cloze?'📱 手機版：文章與目前題目放在同一畫面，使用下一題切換':'共同文章'} · 共 ${gr.length} 題</div>${qs}${nav}</div></div>`:qs}</div>`;
}
function clozeStep(gid,delta){
 const root=el('group-'+gid);if(!root)return;
 const questions=Array.from(root.querySelectorAll('.subquestion'));
 let at=questions.findIndex(x=>x.classList.contains('activeCloze'));
 if(at<0)at=0;
 const next=Math.max(0,Math.min(questions.length-1,at+delta));
 questions.forEach((q,i)=>q.classList.toggle('activeCloze',i===next));
 const label=el('count-'+gid);if(label)label.textContent=`第 ${next+1} / ${questions.length} 題`;
}
function retryWrong(){let v=view.quiz,items=v.items.filter(q=>v.answers[q.id]!==q.ans);if(!items.length){alert('本次全部答對！');return}let included=groupByPassage(v.items).filter(g=>g.some(q=>items.includes(q))).flat();startQuiz(included,'本次錯題重練（文章保留完整題組）')}
function reviewPage(){let ids=Object.keys(state.wrong),q=ids.map(id=>BYID[id]).filter(Boolean),word=ids.filter(id=>id.startsWith('word:'));let groups=groupByPassage(q);let originals=groups.map(g=>g[0]);return `<section class="section"><div class="eyebrow">REVIEW</div><h2>🔁 錯題複習</h2><p class="muted">目前有 ${ids.length} 題待複習。克漏字或閱讀若有錯題，複習時會自動帶入同篇文章的完整題組。</p><div class="buttons"><button class="btn primary" ${!q.length?'disabled':''} onclick="startReview()">開始重練選擇題</button>${word.length?`<button class="btn soft" onclick="startWrongWords()">重練錯誤單字</button>`:''}</div>${q.length?`<div class="panel"><h3>需複習的題型</h3>${['vocab','grammar','cloze','reading','listening'].map(t=>`<p>${kind(t)}：${q.filter(x=>x.type===t).length} 題</p>`).join('')}</div>`:'<div class="empty">目前沒有需要重練的選擇題。可以先去單字島或今天的練習開始！</div>'}</section>`}
function startWrongWords(){let words=DATA.cards.filter(w=>state.wrong['word:'+w.word]);if(!words.length){alert('目前沒有單字錯題');return}startQuiz(buildWordQuiz(words),'錯誤單字重練')}
function startReview(){let base=ALL.filter(q=>state.wrong[q.id]),groups=groupByPassage(ALL);let full=groups.filter(g=>g.some(q=>base.includes(q))).flat();startQuiz(full,'錯題複習 · 共同文章完整呈現')}
function progressPage(){let a=totals(),s=state.sessions.slice(-20).reverse();return `<section class="section"><div class="eyebrow">MY PROGRESS</div><h2>📈 我的學習紀錄</h2><div class="metrics"><div class="metric"><b>${a.attempted}</b>題已練習</div><div class="metric"><b>${a.rate}%</b>題目最新正確率</div><div class="metric"><b>${a.learned}</b>字已學會</div><div class="metric"><b>${state.sessions.length}</b>次已交卷</div><div class="metric"><b>${Object.values(state.spelling||{}).reduce((a,b)=>a+b.tries,0)}</b>次拼字練習</div></div><div class="panel section"><h3>最近的交卷紀錄</h3>${s.length?s.map(x=>`<div style="display:flex;justify-content:space-between;gap:9px;border-bottom:1px solid var(--line);padding:8px 0"><span>${esc(x.title)}<div class="muted small">${new Date(x.at).toLocaleString('zh-TW')}</div></span><b>${x.correct}/${x.total}</b></div>`).join(''):'<p class="muted">尚未交卷，完成一次測驗後會出現在這裡。</p>'}</div><div class="panel"><h3>備份與管理</h3><p class="muted">所有進度保存在目前瀏覽器的 localStorage；換裝置、清除網站資料或某些離線檔案環境可能導致紀錄無法沿用。建議定期匯出。</p><div class="buttons"><button class="btn primary" onclick="exportJSON()">匯出進度 JSON</button><button class="btn soft" onclick="exportCSV()">匯出成績 CSV</button><label class="btn">匯入進度 JSON <input type="file" accept="application/json,.json" style="display:none" onchange="importJSON(this)"></label><button class="btn" onclick="clearAll()">清除本機紀錄</button></div></div></section>`}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('學測英文練習島_進度.json',JSON.stringify({app:'gsat_learning_island_v2',exported:new Date().toISOString(),data:state},null,2),'application/json')}
function exportCSV(){let rows=[['日期','測驗','答對','總題數','正確率'],...state.sessions.map(s=>[s.at,s.title,s.correct,s.total,Math.round(100*s.correct/s.total)+'%'])];download('學測英文練習島_成績.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(input){try{let o=JSON.parse(await input.files[0].text());if(o.app!=='gsat_learning_island_v2'||!o.data||!o.data.results||!o.data.sessions)throw Error('不是本網站匯出的進度格式');if(!confirm('要用匯入檔案覆蓋這個瀏覽器目前的進度嗎？'))return;state={...o.data,spelling:o.data.spelling||{}};save();draw();alert('匯入完成')}catch(e){alert('匯入失敗：'+e.message)}}
function clearAll(){if(confirm('確定清除所有作答與學習進度嗎？此動作無法復原，請先匯出備份。')){state={results:{},wrong:{},learned:{},sessions:[],settings:{},spelling:{}};spellGame=null;save();draw()}}
window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});draw();
</script></body></html>
